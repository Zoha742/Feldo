<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeyCen - Tasks</title>
    <!-- Telegram Web App Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131c2e;
            --card-border: #2a1b4e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary-gradient: linear-gradient(135deg, #7c3aed 0%, #4c1d95 100%);
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0 0 100px 0;
            display: flex;
            justify-content: center;
            overflow-x: hidden;
        }
        .container {
            width: 100%;
            max-width: 480px;
            padding: 16px;
            box-sizing: border-box;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .page-slide-left { transform: translateX(-100px); opacity: 0; }
        .page-slide-right { transform: translateX(100px); opacity: 0; }

        .tasks-header-banner {
            background: var(--primary-gradient);
            border-radius: 16px;
            padding: 20px;
            color: #fff;
            text-align: center;
            margin-bottom: 20px;
        }
        .tasks-header-banner h2 { margin: 0 0 6px 0; font-size: 20px; }
        .tasks-header-banner p { margin: 0; font-size: 12px; opacity: 0.9; }
        
        .task-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .task-grid-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 14px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .task-grid-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .task-grid-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 16px; }
        .task-grid-info h4 { margin: 0; font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 90px; }
        .task-grid-info p { margin: 2px 0 0 0; font-size: 10px; color: var(--text-muted); }
        .task-grid-bottom { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--card-border); padding-top: 10px; }
        .task-grid-reward { font-size: 12px; font-weight: 700; color: #eab308; display: flex; align-items: center; gap: 4px; }
        
        /* বাটনের ডিজাইন */
        .task-start-btn { background: #7c3aed; color: #fff; border: none; padding: 5px 12px; border-radius: 8px; font-size: 11px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .task-start-btn:disabled { background: #475569; cursor: not-allowed; }
        .task-start-btn.completed { background: #10b981; }

        .bottom-nav { 
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); 
            width: 100%; max-width: 480px; background: var(--card-bg); 
            border-top: 1px solid var(--card-border); display: flex; justify-content: space-around; 
            padding: 14px 0 16px 0; box-sizing: border-box; z-index: 100; 
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.08);
            transition: background 0.3s ease;
        }
        .nav-item { text-align: center; color: var(--text-muted); text-decoration: none; font-size: 12px; font-weight: 600; cursor: pointer; flex: 1; }
        .nav-item.active { color: #c084fc; }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 5px; }

        .loading-text { text-align: center; color: var(--text-muted); font-size: 14px; margin-top: 20px; grid-column: span 2; }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <div class="tasks-header-banner">
            <h2>🎁 Channel Tasks</h2>
            <p>Join channels below to earn 50 GP each</p>
        </div>

        <div class="task-grid" id="dynamicTaskGrid">
            <div class="loading-text">Loading tasks...</div>
        </div>
    </div>

    <!-- Navigation Bar -->
    <div class="bottom-nav" id="bottomNav">
        <a class="nav-item" href="index.html"><i class="fa-solid fa-house"></i>Home</a>
        <a class="nav-item active" href="task.html"><i class="fa-solid fa-list-check"></i>Task</a>
        <a class="nav-item" href="ads.html"><i class="fa-solid fa-play"></i>Ads</a>
        <a class="nav-item" href="hotcake.html"><i class="fa-solid fa-hammer"></i>Hotcake</a>
        <a class="nav-item" href="profile.html"><i class="fa-solid fa-user"></i>Profile</a>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBeekTPKMLpOhBH_fMB3eIqWgGy8APQFa8",
            authDomain: "heycen-9a9d8.firebaseapp.com",
            databaseURL: "https://heycen-9a9d8-default-rtdb.firebaseio.com",
            projectId: "heycen-9a9d8",
            storageBucket: "heycen-9a9d8.firebasestorage.app",
            messagingSenderId: "442359961958",
            appId: "1:442359961958:web:815606d4836a66003d50a7",
            measurementId: "G-XNQSP1R3JR"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let tg = window.Telegram.WebApp;
        tg.expand();

        let user = tg.initDataUnsafe.user;
        let userId = user ? user.id.toString() : "7757851056";
        let userRef = db.ref('users/' + userId);

        const channelList = [
            "Xoypo", "Xoyfo", "Xoyco", "Xoyvo", "Xoyqo", "Xoywo", "Ogeeu", "Foyko", "Royci", "Royqo", "Keoiv", "Keoiz", "Bivbo", "Mivbo", "Oviib", "Qeoil", "EoPay", "cyriv", "cypit", "Bypir", "cypij", "Cypia", "Psirt", "Wjstv", "Doyvi", "Foyvi", "Jtrtv", "Apsox", "Apgox", "Oamgo", "Cisot", "Orous", "Okous", "Oeous", "uoike", "Foike", "Doike", "Uniwo", "hizdo", "Eopse", "Risof", "Roiho", "Tebvi", "Coaic", "icoji", "Uaffi", "Xafbi", "Coijo", "Cexmo", "Pexmo", "Wopse", "tavfo", "Kavfo", "Oanlo", "Eamvo", "Oanvo", "oofti", "Foqro", "Foqxo", "Joivo", "Xijci", "Foyzo", "Foljo", "Fuuqo", "fusqo", "fuyqo", "tiqoo", "Qifoo", "Hoyqo", "Qelfo", "Qeljo", "Fnntv", "Jnntv", "Fnitv", "Fbntv", "Cbigo", "Eavno", "Eapno", "Foyqo", "Upbif", "Upbib", "Upbir", "Upbip", "Upbim", "Oesno", "Lanvo", "Yovki", "Oovki", "Uovki", "syfox", "Spyzo", "Vavfo", "Cavfo", "Eavdo", "Coixo", "Fovgi", "Tafvi", "Guzna", "Aovji", "Oelgo", "Yelfo", "Zoosy", "Zivfo", "Uesgo", "Ripfo", "Fovmi", "Wovti", "Jafki", "Dikto", "Joizo", "Uxdao", "Wxdao", "Movti", "Fovti", "Oafki", "Eafki", "Oafmi", "Uafmi", "Vafmi", "Eafmi", "Gigxe", "Eooti", "Eovmi", "Pafbi", "Livbo", "Dapbo", "Roiwo", "Foiqo", "Wigdo", "Diczo", "Oafvi", "Dijzo", "Kovmi", "Oubuy", "Jafvi", "Kafvi", "Cafvi", "Eapti", "Xafti", "Cekio", "Ualjo", "Ealjo", "Uofti", "Eofti", "Pofti", "Vunki", "dagpi", "Hagpi", "Eagpi", "Cagpi", "Zidme", "Relbo", "Eelvo", "Yelvo", "Ohous", "Opous", "Tewvi", "Epegi", "Uafti", "dysel", "dycel", "Oviwo", "Dojvi", "Fisdo", "Rirbo", "Uanbo", "Oamco", "Zisvo", "Oisvo", "Wisvo", "Oispo", "reljo", "uepax", "uevax", "aekax", "Cigzo", "Uevio", "Xikvi", "Oeyvi", "Ueyvi", "Qittoo", "ZilMal", "ZilXal", "XilXal", "BikNak", "BikVak", "BakVak", "XilMal", "Zilfal", "ZilSal", "XalXil", "XikMik", "XilMil", "XikXaq", "HakVak", "HakBak", "HikDik"
        ];

        userRef.once('value').then((snapshot) => {
            let data = snapshot.val() || { tasksDone: 0 };
            let currentTasksDone = data.tasksDone || 0;
            renderTasks(currentTasksDone);
        });

        function renderTasks(startIndex) {
            const grid = document.getElementById('dynamicTaskGrid');
            grid.innerHTML = ''; 

            for(let i = 0; i < 20; i++) {
                let channelIndex = (startIndex + i) % channelList.length;
                let channelName = channelList[channelIndex];
                
                let cardHTML = `
                <div class="task-grid-card">
                    <div class="task-grid-top">
                        <div class="task-grid-icon" style="background: #3b82f6;"><i class="fa-brands fa-telegram"></i></div>
                        <div class="task-grid-info">
                            <h4>@${channelName}</h4>
                            <p>Join & earn</p>
                        </div>
                    </div>
                    <div class="task-grid-bottom">
                        <div class="task-grid-reward"><i class="fa-solid fa-coins"></i> +50</div>
                        <button id="btn-${channelName}" class="task-start-btn" onclick="startTask('${channelName}')">Join</button>
                    </div>
                </div>`;
                grid.innerHTML += cardHTML;
            }
        }

        // টাস্ক শুরু করার ফাংশন
        function startTask(channelUsername) {
            const btn = document.getElementById('btn-' + channelUsername);
            if(btn.disabled) return;

            // টেলিগ্রাম চ্যানেল ওপেন করা (অ্যাপ ব্যাকগ্রাউন্ডে চলে যাবে)
            tg.openTelegramLink('https://t.me/' + channelUsername);

            // বাটনের স্টাইল ও টেক্সট পরিবর্তন (Waiting State)
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Wait 10s';
            btn.disabled = true;

            // ১০ সেকেন্ড পর পয়েন্ট অ্যাড করার টাইমার
            setTimeout(() => {
                completeAndReward(btn);
            }, 10000);
        }

        // পয়েন্ট দেওয়ার ফাংশন
        function completeAndReward(btn) {
            userRef.once('value').then((snapshot) => {
                let data = snapshot.val() || { points: 0, gp: 0, tasksDone: 0 };
                let currentPoints = data.points !== undefined ? data.points : (data.gp || 0);
                let currentTasksDone = data.tasksDone || 0;

                let newPoints = currentPoints + 50;
                let newTasksDone = currentTasksDone + 1;
                
                userRef.update({ 
                    points: newPoints,
                    gp: newPoints,
                    tasksDone: newTasksDone
                }).then(() => {
                    // বাটন "Completed" করা
                    btn.innerHTML = 'Completed';
                    btn.classList.add('completed');
                    
                    // সাকসেস মেসেজ দেখানো
                    tg.showAlert(`Task completed! +50 GP added.`);
                    
                    // রিফ্রেশ করা হলো না, যাতে ইউজারের স্ক্রিন থেকে কার্ড গায়েব না হয়। 
                    // পরেরবার অ্যাপ খুললে নতুন টাস্ক সামনে আসবে।
                });
            });
        }

        let touchStartX = 0;
        window.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; });
        window.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].screenX;
            let diff = touchEndX - touchStartX;
            const container = document.getElementById('mainContainer');
            const bottomNav = document.getElementById('bottomNav');

            if (Math.abs(diff) > 50) {
                if (diff > 0) {
                    container.classList.add('page-slide-right');
                    bottomNav.style.background = '#064e3b';
                    setTimeout(() => { window.location.href = "index.html"; }, 250);
                } else {
                    container.classList.add('page-slide-left');
                    bottomNav.style.background = '#1e1b4b';
                    setTimeout(() => { window.location.href = "ads.html"; }, 250);
                }
            }
        });
    </script>
</body>
</html>
