<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Chapters & Index</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style> 
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #090d16, #1f0b24, #0b1c24);
            color: #f8fafc;
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        .container { width: 100%; max-width: 480px; }
        .back-btn { background: rgba(255,255,255,0.1); color: #38bdf8; border: 1px solid rgba(255,255,255,0.2); padding: 8px 14px; border-radius: 10px; cursor: pointer; margin-bottom: 15px; font-weight: 650; display: inline-flex; align-items: center; gap: 6px; }
        .card { background: rgba(19, 28, 46, 0.9); border: 1px solid rgba(255,255,255,0.1); padding: 14px; border-radius: 14px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; text-decoration: none; color: #fff; transition: 0.3s; }
        .card:hover { border-color: #38bdf8; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="container">
        <button class="back-btn" onclick="history.back()"><i class="fa-solid fa-arrow-left"></i> Back to List</button>
        <h3 id="bookTitleHeading" style="color: #38bdf8; margin-top: 5px; margin-bottom: 15px;">Table of Chapters</h3>
        
        <a href="text.html?chap=1" class="card">
            <div>
                <h4 style="margin:0 0 4px 0; font-size: 13px;">Chapter 1: Foundations & Core Laws</h4>
                <p style="font-size: 11px; color: #94a3b8; margin:0;">Detailed introductory framework</p>
            </div>
            <i class="fa-solid fa-book-open" style="color: #38bdf8; font-size: 16px;"></i>
        </a>
        <a href="text.html?chap=2" class="card">
            <div>
                <h4 style="margin:0 0 4px 0; font-size: 13px;">Chapter 2: Advanced Mathematical Proofs</h4>
                <p style="font-size: 11px; color: #94a3b8; margin:0;">Theorems, equations and analyses</p>
            </div>
            <i class="fa-solid fa-book-open" style="color: #38bdf8; font-size: 16px;"></i>
        </a>
        <a href="text.html?chap=3" class="card">
            <div>
                <h4 style="margin:0 0 4px 0; font-size: 13px;">Chapter 3: Philosophical & Universal Impact</h4>
                <p style="font-size: 11px; color: #94a3b8; margin:0;">Modern implications and conclusions</p>
            </div>
            <i class="fa-solid fa-book-open" style="color: #38bdf8; font-size: 16px;"></i>
        </a>
    </div>
    <script>
        window.Telegram.WebApp.expand();
        const urlParams = new URLSearchParams(window.location.search);
        const book = urlParams.get('book');
        if(book) {
            let formattedTitle = book.replace(/-/g, ' ').toUpperCase();
            document.getElementById('bookTitleHeading').innerText = formattedTitle + ' - Chapters';
        }
    </script>
</body>
</html>
