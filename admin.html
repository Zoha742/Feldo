<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeyCen - Admin Control Center</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131c2e;
            --card-border: #7f1d1d;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
        }
        .container { width: 100%; max-width: 480px; }
        .banner { background: #7f1d1d; padding: 16px; border-radius: 12px; text-align: center; margin-bottom: 20px; }
        .banner h2 { margin: 0; font-size: 18px; color: #fca5a5; }
        
        .request-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
        }
        .request-card h4 { margin: 0 0 4px 0; font-size: 14px; color: #fff; }
        .request-card p { margin: 2px 0; font-size: 12px; color: var(--text-muted); }
        .approve-btn {
            background: #10b981;
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }
        .unauthorized { text-align: center; margin-top: 50px; color: #ef4444; font-size: 18px; }
    </style>
</head>
<body>

    <div class="container" id="admin-container" style="display:none;">
        <div class="banner">
            <h2>🛡️ Admin Control Center</h2>
            <p style="margin:4px 0 0 0; font-size:11px; color:#fca5a5;">Approve GP Sell Requests</p>
        </div>

        <div id="requests-list">
            <p style="text-align:center; color:var(--text-muted);">Loading requests...</p>
        </div>
    </div>

    <div class="unauthorized" id="unauthorized-msg">
        Access Denied! Admins Only.
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBeekTPKMLpOhBH_FMB3eIqWgGy8APQFa8",
            authDomain: "heycen-9a9d8.firebaseapp.com",
            databaseURL: "https://heycan-9a9d8-default-rtdb.firebaseio.com",
            projectId: "heycen-9a9d8",
            storageBucket: "heycen-9a9d8.firebasestorage.app",
            messagingSenderId: "442359961958",
            appId: "1:442359961958:web:815606d4836a66003d50a7",
            measurementId: "G-XNQSP1R3JR"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let tg = window.Telegram.WebApp;
        tg.expand();

        let user = tg.initDataUnsafe.user;
        let userId = user ? user.id.toString() : "7757851056"; 
        const ADMIN_ID = "7757851056";

        if (userId === ADMIN_ID) {
            document.getElementById('admin-container').style.display = "block";
            document.getElementById('unauthorized-msg').style.display = "none";
            loadRequests();
        } else {
            document.getElementById('admin-container').style.display = "none";
            document.getElementById('unauthorized-msg').style.display = "block";
        }

        function loadRequests() {
            let reqRef = db.ref('sell_requests');
            reqRef.on('value', (snapshot) => {
                let data = snapshot.val();
                let listDiv = document.getElementById('requests-list');
                listDiv.innerHTML = "";

                if (!data) {
                    listDiv.innerHTML = "<p style='text-align:center; color:var(--text-muted);'>No pending requests.</p>";
                    return;
                }

                for (let key in data) {
                    let req = data[key];
                    if (req.status === "Pending") {
                        listDiv.innerHTML += `
                            <div class="request-card">
                                <h4>User: ${req.userName} (ID: ${req.userId})</h4>
                                <p><strong>Selling Amount:</strong> ${req.amount} GP</p>
                                <p><strong>Payment Info:</strong> ${req.details}</p>
                                <button class="approve-btn" onclick="approveRequest('${key}', '${req.userId}', ${req.amount})">Approve & Notify</button>
                            </div>
                        `;
                    }
                }
            });
        }

        function approveRequest(reqKey, targetUserId, amount) {
            // Update request status to Approved
            db.ref('sell_requests/' + reqKey).update({ status: "Approved" }).then(() => {
                // Trigger a notification or flag for the user in their node
                db.ref('users/' + targetUserId + '/notifications').push({
                    message: `Congratulations! Your GP sale request for ${amount} GP has been approved by Admin! Payment is processing.`,
                    timestamp: Date.now()
                });
                alert("Request Approved Successfully!");
            });
        }
    </script>
</body>
</html>
