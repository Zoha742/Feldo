<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feldo - Hotcake Mining</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131c2e;
            --card-border: #2a1b4e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary-gradient: linear-gradient(135deg, #7c3aed 0%, #4c1d95 100%);
            --orange-btn: linear-gradient(135deg, #f59e0b, #d97706);
            --green-btn: linear-gradient(135deg, #10b981, #059669);
            --blue-btn: linear-gradient(135deg, #3b82f6, #1d4ed8);
            --modal-bg: #0b132b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0 0 100px 0;
            display: flex;
            justify-content: center;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 16px;
            box-sizing: border-box;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .page-slide-left { transform: translateX(-100px); opacity: 0; }
        .page-slide-right { transform: translateX(100px); opacity: 0; }

        .hotcake-header {
            background: var(--primary-gradient);
            border-radius: 16px;
            padding: 20px;
            color: #fff;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px -5px rgba(124, 58, 237, 0.4);
        }
        .hotcake-header h2 { margin: 0 0 6px 0; font-size: 20px; color: #fff; }
        .hotcake-header p { margin: 0; font-size: 12px; opacity: 0.9; }

        .hotcake-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 20px;
        }

        .hotcake-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .card-top {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 14px;
        }

        .coin-icon {
            width: 48px; height: 48px;
            background: rgba(124, 58, 237, 0.2);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: #fbbf24;
            font-size: 22px;
            border: 1.5px solid #fbbf24;
            flex-shrink: 0;
        }

        .coin-info h4 { margin: 0 0 3px 0; font-size: 16px; font-weight: 700; color: #fff; }
        .coin-info p { margin: 0; font-size: 11px; color: var(--text-muted); }

        .card-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .action-btn {
            border: none;
            padding: 11px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            color: #fff;
            transition: 0.2s;
        }
        .claim-btn {
            background: var(--orange-btn);
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
        }
        .claim-btn:disabled {
            background: #334155;
            color: #94a3b8;
            cursor: not-allowed;
            box-shadow: none;
        }
        .claim-btn:active { transform: scale(0.97); }

        .boost-action-btn {
            background: var(--green-btn);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }
        .boost-action-btn.active {
            background: var(--blue-btn);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        /* Modal Popups */
        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000; backdrop-filter: blur(6px); }
        .modal {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: var(--modal-bg);
            border: 2px solid #7c3aed;
            border-radius: 22px;
            padding: 24px;
            width: 90%;
            max-width: 400px;
            z-index: 1001;
            box-sizing: border-box;
            text-align: center;
            box-shadow: 0 15px 40px rgba(124, 58, 237, 0.3);
        }
        .modal h3 { margin: 0 0 8px 0; font-size: 18px; color: #fbbf24; font-weight: 800; }
        .modal p { font-size: 12px; color: var(--text-muted); margin-bottom: 18px; line-height: 1.4; }
        
        .modal-btn {
            background: #111c38;
            border: 1px solid #2a3b68;
            color: white;
            padding: 12px;
            border-radius: 12px;
            width: 100%;
            margin-bottom: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .modal-btn:hover { background: #1e293b; border-color: #7c3aed; }
        
        .wallet-info-box {
            background: #050a14;
            border: 1px dashed #fbbf24;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            color: #fbbf24;
            font-weight: bold;
            margin-bottom: 16px;
            text-align: center;
        }

        .btn-pay-wallet {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #ffffff; border: none; width: 100%; padding: 12px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }
        .cancel-text { color: #ef4444; font-size: 12px; font-weight: bold; cursor: pointer; margin-top: 10px; display: inline-block; }

        /* বটম নেভিগেশন বার */
        .bottom-nav {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); 
            width: 100%; max-width: 480px; background: var(--card-bg); 
            border-top: 1px solid var(--card-border); display: flex; justify-content: space-around; 
            padding: 12px 0 14px 0; box-sizing: border-box; z-index: 100; 
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.3);
        }
        .nav-item { text-align: center; color: var(--text-muted); text-decoration: none; font-size: 11px; font-weight: 600; cursor: pointer; flex: 1; transition: color 0.2s, transform 0.2s; }
        .nav-item.active { color: #c084fc; transform: translateY(-2px); }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <div class="hotcake-header">
            <h2>🔥 HOTCAKE MINING</h2>
            <p>Active Hotcake Boosters (12 Hours Interval)</p>
        </div>

        <div class="hotcake-list" id="hotcakes-container">
            <!-- Dynamic Hotcake Items -->
        </div>
    </div>

    <!-- Overlay & Modals -->
    <div class="overlay" id="overlay" onclick="closeModals()"></div>

    <!-- Modal 1: Select Boost Plan (6 Different Items with Date & Price) -->
    <div class="modal" id="boostPlanModal">
        <h3>Boost <span id="modal-item-name">Hotcake</span></h3>
        <p>Select your boost plan:</p>
        
        <button class="modal-btn" onclick="confirmWalletBoost('5 Days Plan', 2)"><span>📅 5 Days Boost</span> <b style="color:#fbbf24">$2</b></button>
        <button class="modal-btn" onclick="confirmWalletBoost('10 Days Plan', 5)"><span>📅 10 Days Boost</span> <b style="color:#fbbf24">$5</b></button>
        <button class="modal-btn" onclick="confirmWalletBoost('15 Days Plan', 8)"><span>📅 15 Days Boost</span> <b style="color:#fbbf24">$8</b></button>
        <button class="modal-btn" onclick="confirmWalletBoost('20 Days Plan', 10)"><span>📅 20 Days Boost</span> <b style="color:#fbbf24">$10</b></button>
        <button class="modal-btn" onclick="confirmWalletBoost('25 Days Plan', 15)"><span>📅 25 Days Boost</span> <b style="color:#fbbf24">$15</b></button>
        <button class="modal-btn" onclick="confirmWalletBoost('30 Days Plan', 20)"><span>📅 30 Days Boost</span> <b style="color:#fbbf24">$20</b></button>

        <span class="cancel-text" onclick="closeModals()">Cancel</span>
    </div>

    <!-- Modal 2: Wallet Payment Confirmation -->
    <div class="modal" id="walletPayModal">
        <h3>Wallet Payment</h3>
        <p>You are about to boost <b id="pay-item-name" style="color:#fff"></b> for <b id="pay-plan-name" style="color:#fbbf24"></b>.</p>
        
        <div class="wallet-info-box">
            Amount to Pay: <span id="pay-amount" style="color:#fff;">$0</span><br>
            Your Wallet Balance: <span id="user-wallet-bal" style="color:#22c55e;">$0</span>
        </div>

        <button class="btn-pay-wallet" onclick="executeWalletPayment()">Pay from Wallet & Boost</button>
        <br>
        <span class="cancel-text" onclick="closeModals()">Cancel</span>
    </div>

    <!-- সুসজ্জিত ৫টি অপশনসহ নেভিগেশন বার -->
    <div class="bottom-nav" id="bottomNav">
        <a class="nav-item" href="index.html"><i class="fa-solid fa-house"></i>Home</a>
        <a class="nav-item" href="game.html"><i class="fa-solid fa-gamepad"></i>Game</a>
        <a class="nav-item" href="task.html"><i class="fa-solid fa-list-check"></i>Task</a>
        <a class="nav-item active" href="hotcake.html"><i class="fa-solid fa-hammer"></i>Hotcake</a>
        <a class="nav-item" href="profile.html"><i class="fa-solid fa-user"></i>Profile</a>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBeekTPKMLpOhBH_fMB3eIqWgGy8APQFa8",
            authDomain: "heycen-9a9d8.firebaseapp.com",
            databaseURL: "https://heycen-9a9d8-default-rtdb.firebaseio.com",
            projectId: "heycen-9a9d8",
            storageBucket: "heycen-9a9d8.firebasestorage.app",
            messagingSenderId: "442359961958",
            appId: "1:442359961958:web:815606d4836a66003d50a7",
            measurementId: "G-XNQSP1R3JR"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let tg = window.Telegram.WebApp;
        tg.expand();

        let user = tg.initDataUnsafe.user;
        let userId = user ? user.id.toString() : "7757851056";
        let userRef = db.ref('users/' + userId);

        const COOLDOWN_TIME = 12 * 60 * 60 * 1000; // ১২ ঘণ্টা কুলডাউন

        // ৬টি সম্পূর্ণ আলাদা Hotcake আইটেম (কোনো Rig নেই)
        let hotcakes = [
            { id: 'item1', name: 'Hotcake Alpha', icon: 'fa-fire', normalGp: 50, boostedGp: 500, date: '15 Days', price: '$2.5' },
            { id: 'item2', name: 'Hotcake Beta', icon: 'fa-bolt', normalGp: 50, boostedGp: 500, date: '10 Days', price: '$5' },
            { id: 'item3', name: 'Hotcake Gamma', icon: 'fa-gem', normalGp: 50, boostedGp: 500, date: '15 Days', price: '$8' },
            { id: 'item4', name: 'Hotcake Delta', icon: 'fa-coins', normalGp: 50, boostedGp: 500, date: '20 Days', price: '$10' },
            { id: 'item5', name: 'Hotcake Omega', icon: 'fa-shield-halved', normalGp: 50, boostedGp: 500, date: '25 Days', price: '$15' },
            { id: 'item6', name: 'Hotcake Zeta', icon: 'fa-rocket', normalGp: 50, boostedGp: 500, date: '30 Days', price: '$20' }
        ];

        let userData = {};
        let selectedHotcakeId = "";
        let selectedPlanName = "";
        let selectedPriceUsd = 0;

        userRef.on('value', (snapshot) => {
            userData = snapshot.val() || {};
            renderHotcakes();
        });

        function renderHotcakes() {
            const container = document.getElementById('hotcakes-container');
            container.innerHTML = '';
            let currentTime = Date.now();
            let boosts = userData.boosts || {};

            hotcakes.forEach(item => {
                let rewardGp = item.normalGp;
                let boostBtnText = `Boost (${item.price})`;
                let boostBtnClass = "action-btn boost-action-btn";

                if (boosts[item.id] && boosts[item.id].expireTime > currentTime) {
                    rewardGp = item.boostedGp;
                    boostBtnText = "Boosted (Active)";
                    boostBtnClass = "action-btn boost-action-btn active";
                }

                let lastClaim = userData['lastClaim_' + item.id] || 0;
                let timeLeft = (lastClaim + COOLDOWN_TIME) - currentTime;
                let claimBtnDisabled = false;
                let claimBtnText = `Claim ${rewardGp} GP`;

                if (timeLeft > 0) {
                    claimBtnDisabled = true;
                    let hours = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    let minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
                    let seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);
                    claimBtnText = `${hours}h ${minutes}m ${seconds}s`;
                }

                container.innerHTML += `
                    <div class="hotcake-card">
                        <div class="card-top">
                            <div class="coin-icon"><i class="fa-solid ${item.icon}"></i></div>
                            <div class="coin-info">
                                <h4>${item.name}</h4>
                                <p>Normal: ${item.normalGp} GP | Boosted: ${item.boostedGp} GP<br><b>Duration:</b> ${item.date} | <b>Price:</b> ${item.price}</p>
                            </div>
                        </div>
                        <div class="card-buttons">
                            <button id="claimBtn_${item.id}" class="action-btn claim-btn" ${claimBtnDisabled ? 'disabled' : ''} onclick="claimReward('${item.id}', ${rewardGp})">${claimBtnText}</button>
                            <button class="${boostBtnClass}" onclick="openBoostPlanModal('${item.id}', '${item.name}')">${boostBtnText}</button>
                        </div>
                    </div>
                `;
            });
        }

        function claimReward(id, gp) {
            let now = Date.now();
            userRef.once('value').then((snapshot) => {
                let data = snapshot.val() || {};
                let currentPoints = data.points !== undefined ? data.points : (data.gp || 0);
                let newPoints = currentPoints + gp;

                let updateData = {
                    points: newPoints,
                    gp: newPoints
                };
                updateData['lastClaim_' + id] = now;

                userRef.update(updateData).then(() => {
                    tg.showAlert(`🎉 Successfully claimed ${gp} GP!`);
                });
            });
        }

        setInterval(() => {
            if (document.getElementById('hotcakes-container')) {
                renderHotcakes();
            }
        }, 1000);

        function openBoostPlanModal(hotcakeId, hotcakeName) {
            selectedHotcakeId = hotcakeId;
            document.getElementById('modal-item-name').innerText = hotcakeName;
            document.getElementById('overlay').style.display = 'block';
            document.getElementById('boostPlanModal').style.display = 'block';
        }

        function confirmWalletBoost(planName, priceUsd) {
            selectedPlanName = planName;
            selectedPriceUsd = priceUsd;

            let itemName = hotcakes.find(h => h.id === selectedHotcakeId).name;
            let userWalletBalance = userData.wallet_usd || 0; // ইউজারের ওয়ালেট ডলার ব্যালেন্স

            document.getElementById('pay-item-name').innerText = itemName;
            document.getElementById('pay-plan-name').innerText = planName;
            document.getElementById('pay-amount').innerText = `$${priceUsd}`;
            document.getElementById('user-wallet-bal').innerText = `$${userWalletBalance}`;

            document.getElementById('boostPlanModal').style.display = 'none';
            document.getElementById('walletPayModal').style.display = 'block';
        }

        function executeWalletPayment() {
            let userWalletBalance = userData.wallet_usd || 0;

            if (userWalletBalance < selectedPriceUsd) {
                tg.showAlert("❌ Insufficient Wallet Balance! Please add funds to your wallet.");
                return;
            }

            let newBalance = userWalletBalance - selectedPriceUsd;
            let expireTime = Date.now() + (15 * 24 * 60 * 60 * 1000); // ১৫ দিনের বুস্ট মেয়াদ

            let boostUpdate = {
                wallet_usd: newBalance
            };
            boostUpdate[`boosts/${selectedHotcakeId}/expireTime`] = expireTime;

            userRef.update(boostUpdate).then(() => {
                closeModals();
                tg.showAlert(`🎉 Successfully boosted using Wallet! Enjoy enhanced earnings.`);
            });
        }

        function closeModals() {
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('boostPlanModal').style.display = 'none';
            document.getElementById('walletPayModal').style.display = 'none';
        }
    </script>
</body>
</html>
