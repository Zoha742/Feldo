<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feldo - Hotcake Mining</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131c2e;
            --card-border: #2a1b4e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary-gradient: linear-gradient(135deg, #7c3aed 0%, #4c1d95 100%);
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0 0 100px 0;
            display: flex;
            justify-content: center;
            overflow-x: hidden;
        }
        .container {
            width: 100%;
            max-width: 480px;
            padding: 16px;
            box-sizing: border-box;
        }
        .hotcake-header {
            background: var(--primary-gradient);
            border-radius: 16px;
            padding: 20px;
            color: #fff;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px -5px rgba(124, 58, 237, 0.4);
        }
        .hotcake-header h2 { margin: 0 0 6px 0; font-size: 20px; color: #fff; }
        .hotcake-header p { margin: 0; font-size: 12px; opacity: 0.9; }

        .rig-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: 0.2s;
        }
        .rig-card:hover { border-color: #7c3aed; }
        .rig-info { display: flex; align-items: center; gap: 12px; }
        .rig-icon { width: 45px; height: 45px; background: rgba(124, 58, 237, 0.15); color: #c084fc; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .rig-details h4 { margin: 0 0 4px 0; font-size: 15px; font-weight: 700; color: #fff; }
        .rig-details p { margin: 0; font-size: 11px; color: #94a3b8; }
        
        .rig-actions { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
        .claim-btn { background: #f59e0b; color: #000; border: none; padding: 6px 14px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .claim-btn:disabled { background: #334155; color: #94a3b8; cursor: not-allowed; }
        .boost-btn { background: #10b981; color: #fff; border: none; padding: 6px 14px; border-radius: 8px; font-size: 11px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .boost-btn:hover { opacity: 0.9; }

        /* বটম নেভিগেশন বার */
        .bottom-nav { 
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); 
            width: 100%; max-width: 480px; background: var(--card-bg); 
            border-top: 1px solid var(--card-border); display: flex; justify-content: space-around; 
            padding: 12px 0 14px 0; box-sizing: border-box; z-index: 100; 
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.3);
        }
        .nav-item { text-align: center; color: var(--text-muted); text-decoration: none; font-size: 11px; font-weight: 600; cursor: pointer; flex: 1; transition: color 0.2s, transform 0.2s; }
        .nav-item.active { color: #c084fc; transform: translateY(-2px); }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="hotcake-header">
            <h2>🔥 HOTCAKE RIGS</h2>
            <p>Active Hotcake Rigs (12 Hours Interval)</p>
        </div>

        <div id="rigs-container">
            <!-- Rig 1: Bitcoin -->
            <div class="rig-card">
                <div class="rig-info">
                    <div class="rig-icon" style="color: #f7931a;"><i class="fa-brands fa-bitcoin"></i></div>
                    <div class="rig-details">
                        <h4>Bitcoin (BTC)</h4>
                        <p>Normal: 50 GP | Boosted: 500 GP</p>
                    </div>
                </div>
                <div class="rig-actions">
                    <button id="claimBtn_btc" class="claim-btn" onclick="claimRig('btc', 50)">Claim 50 GP</button>
                    <button class="boost-btn" onclick="boostRig('Bitcoin', 2.5)">Boost ($2.5)</button>
                </div>
            </div>

            <!-- Rig 2: Binance -->
            <div class="rig-card">
                <div class="rig-info">
                    <div class="rig-icon" style="color: #f3ba2f;"><i class="fa-solid fa-coins"></i></div>
                    <div class="rig-details">
                        <h4>Binance (BNB)</h4>
                        <p>Normal: 50 GP | Boosted: 500 GP</p>
                    </div>
                </div>
                <div class="rig-actions">
                    <button id="claimBtn_bnb" class="claim-btn" onclick="claimRig('bnb', 50)">Claim 50 GP</button>
                    <button class="boost-btn" onclick="boostRig('Binance', 2.5)">Boost ($2.5)</button>
                </div>
            </div>

            <!-- Rig 3: Gram Token -->
            <div class="rig-card">
                <div class="rig-info">
                    <div class="rig-icon" style="color: #0088cc;"><i class="fa-solid fa-gem"></i></div>
                    <div class="rig-details">
                        <h4>Gram Token (GRAM)</h4>
                        <p>Normal: 50 GP | Boosted: 500 GP</p>
                    </div>
                </div>
                <div class="rig-actions">
                    <button id="claimBtn_gram" class="claim-btn" onclick="claimRig('gram', 50)">Claim 50 GP</button>
                    <button class="boost-btn" onclick="boostRig('Gram Token', 2.5)">Boost ($2.5)</button>
                </div>
            </div>
        </div>
    </div>

    <!-- সুসজ্জিত ৫টি অপশনসহ নেভিগেশন বার -->
    <div class="bottom-nav">
        <a class="nav-item" href="index.html"><i class="fa-solid fa-house"></i>Home</a>
        <a class="nav-item" href="game.html"><i class="fa-solid fa-gamepad"></i>Game</a>
        <a class="nav-item" href="task.html"><i class="fa-solid fa-list-check"></i>Task</a>
        <a class="nav-item active" href="hotcake.html"><i class="fa-solid fa-hammer"></i>Hotcake</a>
        <a class="nav-item" href="profile.html"><i class="fa-solid fa-user"></i>Profile</a>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBeekTPKMLpOhBH_fMB3eIqWgGy8APQFa8",
            authDomain: "heycen-9a9d8.firebaseapp.com",
            databaseURL: "https://heycen-9a9d8-default-rtdb.firebaseio.com",
            projectId: "heycen-9a9d8",
            storageBucket: "heycen-9a9d8.firebasestorage.app",
            messagingSenderId: "442359961958",
            appId: "1:442359961958:web:815606d4836a66003d50a7",
            measurementId: "G-XNQSP1R3JR"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let tg = window.Telegram.WebApp;
        tg.expand();

        let user = tg.initDataUnsafe.user;
        let userId = user ? user.id.toString() : "7757851056";
        let userRef = db.ref('users/' + userId);

        const COOLDOWN = 12 * 60 * 60 * 1000; // ১২ ঘণ্টা কুলডাউন

        userRef.on('value', snap => {
            let data = snap.val() || {};
            checkRigCooldown('btc', data.lastClaim_btc);
            checkRigCooldown('bnb', data.lastClaim_bnb);
            checkRigCooldown('gram', data.lastClaim_gram);
        });

        function claimRig(rigName, amount) {
            let now = Date.now();
            userRef.once('value').then(snap => {
                let data = snap.val() || {};
                let currentGp = data.gp !== undefined ? data.gp : (data.points || 0);
                
                let updateData = {
                    gp: currentGp + amount,
                    points: currentGp + amount
                };
                updateData['lastClaim_' + rigName] = now;

                userRef.update(updateData).then(() => {
                    tg.showAlert(`🎉 Successfully claimed +${amount} GP from ${rigName.toUpperCase()} Rig!`);
                });
            });
        }

        function checkRigCooldown(rigName, lastClaimTime) {
            let btn = document.getElementById('claimBtn_' + rigName);
            if (!lastClaimTime) {
                btn.innerText = "Claim 50 GP";
                btn.disabled = false;
                return;
            }

            let now = Date.now();
            let timeLeft = (lastClaimTime + COOLDOWN) - now;

            if (timeLeft <= 0) {
                btn.innerText = "Claim 50 GP";
                btn.disabled = false;
            } else {
                btn.disabled = true;
                let hours = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                let minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
                let seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);
                btn.innerText = `${hours}h ${minutes}m ${seconds}s`;
            }
        }

        // প্রতি ১ সেকেন্ডে টাইমার আপডেট করার জন্য ইন্টারভ্যাল
        setInterval(() => {
            userRef.once('value').then(snap => {
                let data = snap.val() || {};
                checkRigCooldown('btc', data.lastClaim_btc);
                checkRigCooldown('bnb', data.lastClaim_bnb);
                checkRigCooldown('gram', data.lastClaim_gram);
            });
        }, 1000);

        function boostRig(rigTitle, priceUsd) {
            tg.showAlert(`🚀 Boost feature for ${rigTitle} (${priceUsd}$) is coming soon!`);
        }
    </script>
</body>
</html>
