<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dress Store - Cloudinary Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f8fafc; color: #0f172a; margin: 0; padding: 0 0 80px 0; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 480px; padding: 16px; box-sizing: border-box; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .balance-badge { background: #fef08a; color: #854d0e; padding: 6px 14px; border-radius: 20px; font-weight: 700; font-size: 13px; }
        
        /* শপ ক্যাটাগরি নেভিগেশন বার */
        .shop-nav { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 16px; scrollbar-width: none; }
        .shop-nav::-webkit-scrollbar { display: none; }
        .cat-btn { background: #fff; border: 1px solid #cbd5e1; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; color: #64748b; }
        .cat-btn.active { background: #ec4899; color: #fff; border-color: #ec4899; }

        .dress-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .dress-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 12px; text-align: center; display: flex; flex-direction: column; justify-content: space-between; }
        .dress-img { width: 100%; height: 140px; object-fit: cover; border-radius: 10px; background: #e2e8f0; margin-bottom: 8px; }
        .dress-title { font-size: 13px; font-weight: 600; margin: 0 0 4px 0; }
        .dress-price { font-size: 12px; font-weight: 700; color: #eab308; margin-bottom: 8px; }
        
        .size-box { display: flex; justify-content: center; gap: 4px; margin-bottom: 8px; }
        .size-btn { background: #f1f5f9; border: 1px solid #cbd5e1; padding: 3px 6px; font-size: 10px; border-radius: 4px; cursor: pointer; font-weight: 600; }
        .size-btn.selected { background: #ec4899; color: #fff; border-color: #ec4899; }

        .buy-btn { background: #ec4899; color: #fff; border: none; padding: 8px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; width: 100%; }
        
        /* মেইন বটম নেভিগেশন */
        .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: #fff; border-top: 1px solid #e2e8f0; display: flex; justify-content: space-around; padding: 12px 0; z-index: 100; }
        .nav-item { text-align: center; color: #64748b; text-decoration: none; font-size: 11px; font-weight: 600; flex: 1; cursor: pointer; }
        .nav-item.active { color: #ec4899; }
        .nav-item i { font-size: 18px; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h3>🛍️ Fashion Dress Shop</h3>
            <div class="balance-badge" id="shopBalance">0 GP</div>
        </div>

        <!-- শপ ক্যাটাগরি নেভিগেশন বার -->
        <div class="shop-nav">
            <button class="cat-btn active" onclick="filterCategory('All', this)">All Styles</button>
            <button class="cat-btn" onclick="filterCategory('Gown', this)">Gowns</button>
            <button class="cat-btn" onclick="filterCategory('Party', this)">Party Wear</button>
            <button class="cat-btn" onclick="filterCategory('Denim', this)">Denim</button>
            <button class="cat-btn" onclick="filterCategory('Evening', this)">Evening</button>
            <button class="cat-btn" onclick="filterCategory('Casual', this)">Casual</button>
        </div>

        <!-- ড্রেস গ্রিড কন্টেইনার -->
        <div class="dress-grid" id="dressGrid"></div>
    </div>

    <!-- বটম নেভিগেশন বার -->
    <div class="bottom-nav">
        <a class="nav-item" href="index.html"><i class="fa-solid fa-house"></i>Home</a>
        <a class="nav-item active" href="shop.html"><i class="fa-solid fa-store"></i>Shop</a>
        <a class="nav-item" href="profile.html"><i class="fa-solid fa-user"></i>Profile</a>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let goldPoints = localStorage.getItem('gold_points') ? parseInt(localStorage.getItem('gold_points')) : 100;
        document.getElementById('shopBalance').innerText = goldPoints + " GP";

        // আপনার দেওয়া ক্লাউডিনারি লিংকগুলো দিয়ে ড্রেস লিস্ট তৈরি করা হলো
        const cloudDresses = [
            { name: "Royal Floral Gown", cat: "Gown", price: 120, img: "https://res.cloudinary.com/dyqegwdme/image/upload/v1788180133/2_g6yybc.webp" },
            { name: "Classic Party Dress", cat: "Party", price: 150, img: "https://res.cloudinary.com/dyqegwdme/image/upload/v1788180133/4_jwi1bs.webp" },
            { name: "Elegance Evening Wear", cat: "Evening", price: 180, img: "https://res.cloudinary.com/dyqegwdme/image/upload/v1788180133/7_zz8gga.webp" },
            { name: "Casual Denim Outfit", cat: "Denim", price: 100, img: "https://res.cloudinary.com/dyqegwdme/image/upload/v1788180133/1_ufizyp.webp" },
            { name: "Summer Breeze Gown", cat: "Gown", price: 130, img: "https://res.cloudinary.com/dyqegwdme/image/upload/v1788180132/3_tm4w9f.webp" },
            { name: "Chic Party Frock", cat: "Party", price: 160, img: "https://res.cloudinary.com/dyqegwdme/image/upload/v1788180132/5_lphyur.webp" },
            { name: "Modern Denim Style", cat: "Denim", price: 110, img: "https://res.cloudinary.com/dyqegwdme/image/upload/v1788180132/6_a7nrjj.webp" },
            { name: "Velvet Night Outfit", cat: "Evening", price: 190, img: "https://res.cloudinary.com/dyqegwdme/image/upload/v1788180132/9_pyynus.webp" },
            { name: "Designer Casual Wear", cat: "Casual", price: 95, img: "https://res.cloudinary.com/dyqegwdme/image/upload/v1788180131/8_rnhjh5.webp" },
            { name: "Luxury Party Gown", cat: "Party", price: 210, img: "https://res.cloudinary.com/dyqegwdme/image/upload/v1788180131/10_l7enmg.webp" },
            { name: "Graceful Maxi Dress", cat: "Gown", price: 140, img: "https://res.cloudinary.com/dyqegwdme/image/upload/v1788180130/19_fazthb.webp" },
            { name: "Stylish Evening Look", cat: "Evening", price: 175, img: "https://res.cloudinary.com/dyqegwdme/image/upload/v1788180131/16_ff8bo3.webp" },
            { name: "Premium Party Dress", cat: "Party", price: 220, img: "https://res.cloudinary.com/dyqegwdme/image/upload/v1788180130/11_nmuqvi.webp" },
            { name: "Trend Setter Denim", cat: "Denim", price: 125, img: "https://res.cloudinary.com/dyqegwdme/image/upload/v1788180131/17_nevt22.webp" },
            { name: "Royal Blue Gown", cat: "Gown", price: 195, img: "https://res.cloudinary.com/dyqegwdme/image/upload/v1788180130/21_g8xdy3.webp" },
            { name: "Classic Evening Style", cat: "Evening", price: 165, img: "https://res.cloudinary.com/dyqegwdme/image/upload/v1788180130/18_vtbuam.webp" },
            { name: "Modest Casual Fit", cat: "Casual", price: 105, img: "https://res.cloudinary.com/dyqegwdme/image/upload/v1788180130/12_lxoxkk.webp" },
            { name: "Special Event Gown", cat: "Gown", price: 230, img: "https://res.cloudinary.com/dyqegwdme/image/upload/v1788180129/14_vv3edn.webp" },
            { name: "Vibrant Party Frock", cat: "Party", price: 185, img: "https://res.cloudinary.com/dyqegwdme/image/upload/v1788180130/13_j1iqqj.webp" },
            { name: "Urban Denim Wear", cat: "Denim", price: 115, img: "https://res.cloudinary.com/dyqegwdme/image/upload/v1788180129/20_nl0iqq.webp" },
            { name: "Exquisite Evening Gown", cat: "Evening", price: 250, img: "https://res.cloudinary.com/dyqegwdme/image/upload/v1788180129/22_ostfn4.webp" },
            { name: "Daily Casual Set", cat: "Casual", price: 90, img: "https://res.cloudinary.com/dyqegwdme/image/upload/v1788180129/24_pbzdij.webp" },
            { name: "Chic Designer Dress", cat: "Party", price: 200, img: "https://res.cloudinary.com/dyqegwdme/image/upload/v1788180129/23_exv5bf.webp" },
            { name: "Elite Collection Gown", cat: "Gown", price: 240, img: "https://res.cloudinary.com/dyqegwdme/image/upload/v1788180129/15_vgqlvi.webp" }
        ];

        let selectedSizes = {};

        function renderDresses(list) {
            const dressGrid = document.getElementById('dressGrid');
            dressGrid.innerHTML = '';
            
            list.forEach((dress, index) => {
                dressGrid.innerHTML += `
                    <div class="dress-card">
                        <img src="${dress.img}" class="dress-img" alt="Dress">
                        <div>
                            <h4 class="dress-title">${dress.name}</h4>
                            <div class="dress-price">🪙 ${dress.price} GP</div>
                            <div class="size-box" id="sizes_${index}">
                                <button class="size-btn" onclick="selectSize(${index}, 'S', this)">S</button>
                                <button class="size-btn" onclick="selectSize(${index}, 'M', this)">M</button>
                                <button class="size-btn" onclick="selectSize(${index}, 'L', this)">L</button>
                                <button class="size-btn" onclick="selectSize(${index}, 'XL', this)">XL</button>
                            </div>
                        </div>
                        <button class="buy-btn" onclick="confirmOrder('${dress.name}', ${dress.price}, ${index})">Buy Now</button>
                    </div>
                `;
            });
        }

        // প্রথমে সব ড্রেস লোড হবে
        renderDresses(cloudDresses);

        function filterCategory(cat, btn) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            if (cat === 'All') {
                renderDresses(cloudDresses);
            } else {
                let filtered = cloudDresses.filter(d => d.category === cat);
                renderDresses(filtered);
            }
        }

        function selectSize(dressId, size, btn) {
            selectedSizes[dressId] = size;
            let parent = document.getElementById(`sizes_${dressId}`);
            parent.querySelectorAll('.size-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
        }

        function confirmOrder(dressName, price, dressId) {
            let chosenSize = selectedSizes[dressId];
            if (!chosenSize) {
                tg.showAlert("⚠️ Please select a dress size (S, M, L, XL) first!");
                return;
            }

            let savedAddress = localStorage.getItem('shipping_address');
            if (!savedAddress) {
                tg.showAlert("⚠️ Please set your Home Shipping Address in your Profile page before purchasing!");
                setTimeout(() => {
                    window.location.href = "profile.html";
                }, 1500);
                return;
            }

            if (goldPoints >= price) {
                goldPoints -= price;
                localStorage.setItem('gold_points', goldPoints);
                document.getElementById('shopBalance').innerText = goldPoints + " GP";

                let myOrders = JSON.parse(localStorage.getItem('my_orders') || '[]');
                myOrders.push(`${dressName} [Size: ${chosenSize}]`);
                localStorage.setItem('my_orders', JSON.stringify(myOrders));

                tg.showAlert(`🎉 Order Confirmed! You bought "${dressName}" (Size: ${chosenSize}). Check Profile for shipping status.`);
            } else {
                tg.showAlert("❌ Insufficient Gold Points! Watch ads and complete tasks to earn more points.");
            }
        }
    </script>
</body>
</html>
