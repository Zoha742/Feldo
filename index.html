<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeyCen - Task Hub</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
     
    <!-- Adsgram Official SDK Script (আপনার নতুন Block ID এখানে বসাবেন) -->
    <script src="https://sad.adsgram.ai/js/adsgram.js"></script>
 
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --border-color: #e2e8f0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0 0 80px 0;
            display: flex;
            justify-content: center;
        }
        .container { width: 100%; max-width: 480px; padding: 16px; box-sizing: border-box; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .user-info h2 { margin: 0; font-size: 20px; font-weight: 700; }
        .user-info p { margin: 4px 0 0 0; font-size: 13px; color: var(--text-muted); }
        .profile-link { cursor: pointer; text-decoration: none; color: inherit; display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; background: #e2e8f0; padding: 6px 12px; border-radius: 20px; }
        .points-card { background: var(--primary-gradient); border-radius: 20px; padding: 24px; color: #ffffff; margin-bottom: 24px; box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4); }
        .points-title { font-size: 13px; opacity: 0.9; margin-bottom: 6px; }
        .points-value { font-size: 34px; font-weight: 800; margin-bottom: 6px; }
        .badge { display: inline-block; background: rgba(255, 255, 255, 0.2); padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .section-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; }
        .task-card { background: var(--card-bg); border: 1px solid var(--border-color); padding: 14px; border-radius: 16px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .task-left { display: flex; align-items: center; gap: 12px; }
        .task-icon { width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px; background: #8b5cf6; }
        .task-info h4 { margin: 0 0 4px 0; font-size: 14px; font-weight: 600; }
        .task-info p { margin: 0; font-size: 11px; color: var(--text-muted); }
        .task-reward { font-size: 12px; font-weight: 700; color: #eab308; margin-top: 4px; }
        .action-btn { background: #6366f1; color: #fff; border: none; padding: 8px 16px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; }
        
        /* বটম নেভিগেশন */
        .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: #fff; border-top: 1px solid #e2e8f0; display: flex; justify-content: space-around; padding: 12px 0; z-index: 100; }
        .nav-item { text-align: center; color: #64748b; text-decoration: none; font-size: 11px; font-weight: 600; flex: 1; cursor: pointer; }
        .nav-item.active { color: #6366f1; }
        .nav-item i { font-size: 18px; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="user-info">
                <h2>Hello, <span id="username">User</span> 👋</h2>
                <p>Complete tasks & earn utility points</p>
            </div>
            <a href="profile.html" class="profile-link"><i class="fa-solid fa-user"></i> Pro</a>
        </div>

        <div class="points-card">
            <div class="points-title">Available Utility Points</div>
            <div class="points-value" id="balance">150</div>
            <div class="badge"><i class="fa-solid fa-shield-check"></i> Verified Utility Account</div>
        </div>

        <div class="section-title">Interactive Task Hub</div>

        <div class="task-card">
            <div class="task-left">
                <div class="task-icon"><i class="fa-solid fa-play"></i></div>
                <div class="task-info">
                    <h4>Watch Productivity Ad</h4>
                    <p>Complete view to earn rewards</p>
                    <div class="task-reward"><i class="fa-solid fa-coins"></i> +50 Points</div>
                </div>
            </div>
            <button class="action-btn" onclick="watchAdTask()">Start</button>
        </div>

        <div class="task-card">
            <div class="task-left">
                <div class="task-icon" style="background: #22c55e;"><i class="fa-solid fa-list-check"></i></div>
                <div class="task-info">
                    <h4>Daily Survey Task</h4>
                    <p>Answer feedback questions</p>
                    <div class="task-reward"><i class="fa-solid fa-coins"></i> +100 Points</div>
                </div>
            </div>
            <button class="action-btn" style="background: #22c55e;" onclick="watchAdTask()">Start</button>
        </div>
    </div>

    <!-- নেভিগেশন বার -->
    <div class="bottom-nav">
        <a class="nav-item active" href="index.html"><i class="fa-solid fa-house"></i>Home</a>
        <a class="nav-item" href="dash.html"><i class="fa-solid fa-gauge"></i>Dash</a>
        <a class="nav-item" href="tasks.html"><i class="fa-solid fa-list-check"></i>Tasks</a>
        <a class="nav-item" href="profile.html"><i class="fa-solid fa-user"></i>Profile</a>
        <a class="nav-item" href="settings.html"><i class="fa-solid fa-gear"></i>Settings</a>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let user = tg.initDataUnsafe.user;
        if (user && user.first_name) {
            document.getElementById('username').innerText = user.first_name;
        }

        // Adsgram Controller (আপনার নতুন Block ID এখানে বসাবেন)
        const adsgramController = window.Adsgram ? window.Adsgram.init({ blockId: "YOUR_NEW_BLOCK_ID" }) : null;

        function watchAdTask() {
            if (adsgramController) {
                adsgramController.show()
                    .then(() => {
                        let current = parseInt(document.getElementById('balance').innerText);
                        let updated = current + 50;
                        document.getElementById('balance').innerText = updated;
                        tg.showAlert("Success! +50 Points added to your account.");
                    })
                    .catch((result) => {
                        console.log("Adsgram error:", result);
                        tg.showAlert("Ad skipped or unavailable.");
                    });
            } else {
                tg.showAlert("Task verified successfully!");
            }
        }
    </script>
</body>
</html>
