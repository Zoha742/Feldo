<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeyCen Dress Store - Home</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Adsgram Official SDK Script -->
    <script src="https://sad.adsgram.ai/js/adsgram.js"></script>

    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary-gradient: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%);
            --border-color: #e2e8f0;
        }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 0 0 80px 0; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 480px; padding: 16px; box-sizing: border-box; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .user-info h2 { margin: 0; font-size: 18px; font-weight: 700; }
        .user-info p { margin: 2px 0 0 0; font-size: 12px; color: var(--text-muted); }
        
        .gold-card { background: var(--primary-gradient); border-radius: 20px; padding: 20px; color: #ffffff; margin-bottom: 20px; box-shadow: 0 10px 20px rgba(236, 72, 153, 0.3); }
        .gold-title { font-size: 12px; opacity: 0.9; margin-bottom: 4px; }
        .gold-value { font-size: 28px; font-weight: 800; }
        
        .section-title { font-size: 15px; font-weight: 700; margin: 16px 0 10px 0; display: flex; justify-content: space-between; align-items: center; }
        
        .task-list, .ads-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .item-card { background: var(--card-bg); border: 1px solid var(--border-color); padding: 12px 14px; border-radius: 14px; display: flex; justify-content: space-between; align-items: center; }
        .item-left { display: flex; align-items: center; gap: 12px; flex: 1; }
        .item-icon { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 16px; flex-shrink: 0; }
        .item-info { flex: 1; }
        .item-info h4 { margin: 0 0 2px 0; font-size: 13px; font-weight: 600; }
        .item-info p { margin: 0; font-size: 11px; color: var(--text-muted); }
        .reward-tag { font-size: 11px; font-weight: 700; color: #eab308; margin-top: 2px; }
        
        .action-btn { background: #8b5cf6; color: #fff; border: none; padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: 0.3s; }
        .action-btn.claim { background: #eab308 !important; color: #000 !important; }
        .action-btn.completed { background: #22c55e !important; color: #fff !important; cursor: default; }
        
        /* বটম নেভিগেশন */
        .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: #fff; border-top: 1px solid #e2e8f0; display: flex; justify-content: space-around; padding: 12px 0; z-index: 100; }
        .nav-item { text-align: center; color: #64748b; text-decoration: none; font-size: 11px; font-weight: 600; flex: 1; cursor: pointer; }
        .nav-item.active { color: #ec4899; }
        .nav-item i { font-size: 18px; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="user-info">
                <h2>Welcome, <span id="username">User</span> 👋</h2>
                <p>Earn Gold Points & Shop Dresses</p>
            </div>
        </div>

        <!-- গোল্ড পয়েন্ট কার্ড -->
        <div class="gold-card">
            <div class="gold-title"><i class="fa-solid fa-coins"></i> Your Gold Balance</div>
            <div class="gold-value" id="goldBalance">0 GP</div>
        </div>

        <!-- ১০টি অ্যাড সেকশন -->
        <div class="section-title">
            <span><i class="fa-solid fa-play" style="color: #ec4899;"></i> Watch Ads (10 Ads Available)</span>
        </div>
        <div class="ads-list" id="adsContainer"></div>

        <!-- চ্যানেল জয়েনিং টাস্ক সেকশন -->
        <div class="section-title">
            <span><i class="fa-solid fa-bullhorn" style="color: #8b5cf6;"></i> Join Channels (+100 GP Each)</span>
        </div>
        <div class="task-list" id="tasksContainer"></div>
    </div>

    <!-- নেভিগেশন বার -->
    <div class="bottom-nav">
        <a class="nav-item active" href="index.html"><i class="fa-solid fa-house"></i>Home</a>
        <a class="nav-item" href="shop.html"><i class="fa-solid fa-store"></i>Shop</a>
        <a class="nav-item" href="profile.html"><i class="fa-solid fa-user"></i>Profile</a>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let user = tg.initDataUnsafe.user;
        let userName = user ? (user.first_name || "User") : "User";
        document.getElementById('username').innerText = userName;

        let goldPoints = localStorage.getItem('gold_points') ? parseInt(localStorage.getItem('gold_points')) : 100;
        document.getElementById('goldBalance').innerText = goldPoints + " GP";

        function updateGold(amount) {
            goldPoints += amount;
            localStorage.setItem('gold_points', goldPoints);
            document.getElementById('goldBalance').innerText = goldPoints + " GP";
        }

        // Adsgram Controller (আপনার Block ID এখানে বসাবেন)
        const adsgramController = window.Adsgram ? window.Adsgram.init({ blockId: "YOUR_NEW_BLOCK_ID" }) : null;

        function watchAd(adNumber) {
            if (adsgramController) {
                adsgramController.show()
                    .then(() => {
                        updateGold(20);
                        tg.showAlert(`🎉 Ad #${adNumber} watched! +20 Gold Points earned.`);
                    })
                    .catch((result) => {
                        console.log("Adsgram error:", result);
                        tg.showAlert("⚠️ No ads available right now. Please try again later!");
                    });
            } else {
                tg.showAlert("⚠️ No ads available at this moment. Please check back later.");
            }
        }

        // টাস্ক স্টেট ম্যানেজমেন্ট
        let completedTasks = JSON.parse(localStorage.getItem('completed_tasks') || '{}');
        let visitedTasks = JSON.parse(localStorage.getItem('visited_tasks') || '{}');

        function handleTask(username, btnElement) {
            let cleanUser = username.replace('@', '');
            let taskId = "task_" + cleanUser;

            if (completedTasks[taskId]) return;

            // ধাপ ১: লিংকে ক্লিক করলে চ্যানেল ওপেন হবে (অ্যাপ বন্ধ হবে না)
            if (!visitedTasks[taskId]) {
                let channelUrl = `https://t.me/${cleanUser}`;
                
                // Telegram WebApp API দিয়ে সেফ ওপেন
                if (tg.openTelegramLink) {
                    tg.openTelegramLink(channelUrl);
                } else {
                    window.open(channelUrl, '_blank');
                }

                visitedTasks[taskId] = true;
                localStorage.setItem('visited_tasks', JSON.stringify(visitedTasks));

                btnElement.innerText = "Claim +100 GP";
                btnElement.classList.add('claim');
                tg.showAlert("Channel opened! Join the channel and return here to claim your +100 GP.");
            } 
            // ধাপ ২: জয়েন করার পর ক্লেইম বাটনে চাপ দিলে পয়েন্ট যোগ হবে
            else {
                updateGold(100);
                completedTasks[taskId] = true;
                localStorage.setItem('completed_tasks', JSON.stringify(completedTasks));

                btnElement.innerText = "Completed";
                btnElement.classList.remove('claim');
                btnElement.classList.add('completed');
                btnElement.disabled = true;

                tg.showAlert("🎉 Task completed! +100 Gold Points added to your account.");
            }
        }

        // ১০টি অ্যাড রেন্ডার
        const adsContainer = document.getElementById('adsContainer');
        for (let i = 1; i <= 10; i++) {
            adsContainer.innerHTML += `
                <div class="item-card">
                    <div class="item-left">
                        <div class="item-icon" style="background: #ec4899;"><i class="fa-solid fa-video"></i></div>
                        <div class="item-info">
                            <h4>Promotional Ad #${i}</h4>
                            <p>Watch video & earn points</p>
                            <div class="reward-tag">+20 Gold Points</div>
                        </div>
                    </div>
                    <button class="action-btn" style="background: #ec4899;" onclick="watchAd(${i})">Watch</button>
                </div>
            `;
        }

        // ১৪টি টেলিগ্রাম চ্যানেল টাস্ক রেন্ডার
        const channelUsernames = ["@Vunaq", "@Luqpo", "@Lugko", "@Lujpo", "@Fovxo", "@Xoypo", "@Xoyfo", "@Xoyco", "@Xoyvo", "@Xoyqo", "@Xoywo", "@Foyko", "@Royci", "@Royqo"];
        
        const tasksContainer = document.getElementById('tasksContainer');
        channelUsernames.forEach((username) => {
            let cleanUser = username.replace('@', '');
            let taskId = "task_" + cleanUser;
            let isDone = completedTasks[taskId];
            let isVisited = visitedTasks[taskId];
            
            let btnText = "Go & Join";
            let btnClass = "action-btn";

            if (isDone) {
                btnText = "Completed";
                btnClass = "action-btn completed";
            } else if (isVisited) {
                btnText = "Claim +100 GP";
                btnClass = "action-btn claim";
            }
            
            tasksContainer.innerHTML += `
                <div class="item-card">
                    <div class="item-left">
                        <div class="item-icon" style="background: #8b5cf6;"><i class="fa-solid fa-bullhorn"></i></div>
                        <div class="item-info">
                            <h4>Join Channel ${username}</h4>
                            <p>Subscribe channel to earn reward</p>
                            <div class="reward-tag">+100 Gold Points</div>
                        </div>
                    </div>
                    <button class="${btnClass}" ${isDone ? 'disabled' : ''} onclick="handleTask('${username}', this)">
                        ${btnText}
                    </button>
                </div>
            `;
        });
    </script>
</body>
</html>
