<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeyCen Book Library - Home</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0b0f19; color: #fff; margin: 0; padding: 16px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 480px; }
        .banner { background: linear-gradient(135deg, #3b82f6, #1e40af); padding: 20px; border-radius: 16px; text-align: center; margin-bottom: 20px; }
        .card { background: #131c2e; border: 1px solid #1e293b; padding: 14px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; text-decoration: none; color: #fff; }
        .card:hover { border-color: #38bdf8; }
    </style>
</head>
<body>
    <div class="container">
        <div class="banner">
            <h2>📚 HeyCen Library Hub</h2>
            <p>Select a category to explore books</p>
        </div>
        
        <a href="book.html?cat=physics" class="card">
            <div><i class="fa-solid fa-atom" style="color: #ff9068;"></i> Physics & Science</div>
            <i class="fa-solid fa-chevron-right" style="font-size: 12px; color: #94a3b8;"></i>
        </a>
        <a href="book.html?cat=math" class="card">
            <div><i class="fa-solid fa-square-root-variable" style="color: #38bdf8;"></i> Mathematics</div>
            <i class="fa-solid fa-chevron-right" style="font-size: 12px; color: #94a3b8;"></i>
        </a>
        <a href="book.html?cat=literature" class="card">
            <div><i class="fa-solid fa-feather" style="color: #34d399;"></i> World Literature</div>
            <i class="fa-solid fa-chevron-right" style="font-size: 12px; color: #94a3b8;"></i>
        </a>
    </div>
    <script>window.Telegram.WebApp.expand();</script>
</body>
</html>
