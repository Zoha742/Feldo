<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeyCen - Home</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131c2e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary-gradient: linear-gradient(135deg, #7c3aed 0%, #4c1d95 100%);
            --border-color: #2a1b4e;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            margin: 0; 
            padding: 0 0 90px 0; 
            display: flex; 
            justify-content: center; 
            overflow-x: hidden;
        }
        .container { 
            width: 100%; 
            max-width: 480px; 
            padding: 16px; 
            box-sizing: border-box; 
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        /* সোয়াইপ অ্যানিমেশন ক্লাস */
        .page-slide-left { transform: translateX(-100px); opacity: 0; }
        .page-slide-right { transform: translateX(100px); opacity: 0; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .user-info h2 { margin: 0; font-size: 20px; font-weight: 700; color: #fff; }
        .user-info p { margin: 4px 0 0 0; font-size: 13px; color: var(--text-muted); }
        .avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; cursor: pointer; border: 2px solid #7c3aed; }
        .points-card { background: var(--primary-gradient); border-radius: 20px; padding: 24px; color: #ffffff; position: relative; overflow: hidden; margin-bottom: 24px; box-shadow: 0 10px 25px rgba(124, 58, 237, 0.3); }
        .points-title { font-size: 13px; opacity: 0.9; margin-bottom: 6px; }
        .points-value { font-size: 34px; font-weight: 800; margin-bottom: 10px; }
        .usd-badge { display: inline-block; background: rgba(255, 255, 255, 0.2); padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        
        /* ৫টি অপশনসহ নেভিগেশন বার এবং ডাইনামিক কালার ইফেক্ট */
        .bottom-nav { 
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); 
            width: 100%; max-width: 480px; background: var(--card-bg); 
            border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; 
            padding: 10px 0; box-sizing: border-box; z-index: 100; 
            transition: background 0.3s ease;
        }
        .nav-item { text-align: center; color: var(--text-muted); text-decoration: none; font-size: 10px; font-weight: 600; cursor: pointer; flex: 1; }
        .nav-item.active { color: #c084fc; }
        .nav-item i { font-size: 16px; display: block; margin-bottom: 3px; }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <div class="header">
            <div class="user-info">
                <h2>Hello, <span id="username">User</span> 👋</h2>
                <p>Welcome to HeyCen Crypto</p>
            </div>
            <img id="user-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" class="avatar" alt="User" onclick="location.href='profile.html'">
        </div>

        <div class="points-card">
            <div class="points-title">Your Points (GP)</div>
            <div class="points-value" id="balance">0</div>
            <div class="usd-badge" id="usd-value">≈ $0.00</div>
        </div>
    </div>

    <!-- ৫টি অপশনসহ নেভিগেশন বার -->
    <div class="bottom-nav" id="bottomNav">
        <a class="nav-item active" href="index.html"><i class="fa-solid fa-house"></i>Home</a>
        <a class="nav-item" href="task.html"><i class="fa-solid fa-list-check"></i>Task</a>
        <a class="nav-item" href="ads.html"><i class="fa-solid fa-play"></i>Ads</a>
        <a class="nav-item" href="hotcake.html"><i class="fa-solid fa-hammer"></i>Mining</a>
        <a class="nav-item" href="profile.html"><i class="fa-solid fa-user"></i>Profile</a>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBeekTPKMLpOhBH_fMB3eIqWgGy8APQFa8",
            authDomain: "heycen-9a9d8.firebaseapp.com",
            databaseURL: "https://heycen-9a9d8-default-rtdb.firebaseio.com",
            projectId: "heycen-9a9d8",
            storageBucket: "heycen-9a9d8.firebasestorage.app",
            messagingSenderId: "442359961958",
            appId: "1:442359961958:web:815606d4836a66003d50a7",
            measurementId: "G-XNQSP1R3JR"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let tg = window.Telegram.WebApp;
        tg.expand();

        let user = tg.initDataUnsafe.user;
        let userId = user ? user.id.toString() : "7757851056";
        let username = user ? (user.first_name || "User") : "User";

        document.getElementById('username').innerText = username;
        if (user && user.photo_url) { document.getElementById('user-avatar').src = user.photo_url; }

        db.ref('users/' + userId).on('value', (snapshot) => {
            let data = snapshot.val() || { points: 0 };
            let pts = data.points !== undefined ? data.points : (data.gp || 0);
            document.getElementById('balance').innerText = pts.toLocaleString();
            document.getElementById('usd-value').innerText = '≈ $' + (pts / 10000).toFixed(2);
        });

        // সোয়াইপ লজিক এবং অ্যানিমেশন
        let touchStartX = 0;
        window.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; });
        window.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].screenX;
            let diff = touchEndX - touchStartX;
            const container = document.getElementById('mainContainer');
            const bottomNav = document.getElementById('bottomNav');

            if (Math.abs(diff) > 50) {
                if (diff < 0) {
                    // বামে টানলে Task পেজে যাবে
                    container.classList.add('page-slide-left');
                    bottomNav.style.background = '#1e1b4b';
                    setTimeout(() => { window.location.href = "task.html"; }, 250);
                }
            }
        });
    </script>
</body>
</html>
