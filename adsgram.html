<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeyCen - Adsgram Watch & Earn</title>
    <!-- Telegram Web App Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Adsgram SDK -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131c2e;
            --card-border: #2a1b4e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary-gradient: linear-gradient(135deg, #7c3aed 0%, #4c1d95 100%);
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0 0 100px 0;
            display: flex;
            justify-content: center;
            overflow-x: hidden;
        }
        .container {
            width: 100%;
            max-width: 480px;
            padding: 16px;
            box-sizing: border-box;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .page-slide-left { transform: translateX(-100px); opacity: 0; }
        .page-slide-right { transform: translateX(100px); opacity: 0; }

        .header-banner {
            background: var(--primary-gradient);
            border-radius: 16px;
            padding: 20px;
            color: #fff;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 8px 25px rgba(124, 58, 237, 0.25);
        }
        .header-banner h2 { margin: 0 0 6px 0; font-size: 20px; }
        .header-banner p { margin: 0; font-size: 12px; opacity: 0.9; }
        
        .section-title {
            font-size: 16px;
            font-weight: 700;
            margin: 20px 0 12px 0;
            color: #c084fc;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .video-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .video-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .video-icon { width: 36px; height: 36px; background: #7c3aed; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 16px; }
        .video-info h4 { margin: 0; font-size: 13px; font-weight: 700; }
        .video-info p { margin: 2px 0 0 0; font-size: 10px; color: var(--text-muted); }
        .video-bottom { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--card-border); padding-top: 10px; }
        .video-reward { font-size: 12px; font-weight: 700; color: #eab308; display: flex; align-items: center; gap: 4px; }
        .watch-btn { background: #7c3aed; color: #fff; border: none; padding: 6px 12px; border-radius: 8px; font-size: 11px; font-weight: 600; cursor: pointer; }
        .watch-btn.done { background: #10b981; cursor: default; }

        .bottom-nav {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); 
            width: 100%; max-width: 480px; background: var(--card-bg); 
            border-top: 1px solid var(--card-border); display: flex; justify-content: space-around; 
            padding: 14px 0 16px 0; box-sizing: border-box; z-index: 100; 
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.08);
            transition: background 0.3s ease;
        }
        .nav-item { text-align: center; color: var(--text-muted); text-decoration: none; font-size: 12px; font-weight: 600; cursor: pointer; flex: 1; }
        .nav-item.active { color: #c084fc; }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 5px; }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <!-- Header Banner -->
        <div class="header-banner">
            <h2>🎬 Adsgram Rewarded Ads</h2>
            <p>Watch video ads to earn extra GP</p>
        </div>

        <!-- 6 Video Ads Section -->
        <div class="section-title"><i class="fa-solid fa-play-circle"></i> Watch Video Ads (6 Available)</div>
        <div class="video-grid" id="video-ads-container">
            <!-- Populated via JS -->
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav" id="bottomNav">
        <a class="nav-item" href="index.html"><i class="fa-solid fa-house"></i>Home</a>
        <a class="nav-item" href="task.html"><i class="fa-solid fa-list-check"></i>Task</a>
        <a class="nav-item active" href="adsgram.html"><i class="fa-solid fa-play"></i>Ads</a>
        <a class="nav-item" href="hotcake.html"><i class="fa-solid fa-hammer"></i>Hotcake</a>
        <a class="nav-item" href="profile.html"><i class="fa-solid fa-user"></i>Profile</a>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBeekTPKMLpOhBH_fMB3eIqWgGy8APQFa8",
            authDomain: "heycen-9a9d8.firebaseapp.com",
            databaseURL: "https://heycen-9a9d8-default-rtdb.firebaseio.com",
            projectId: "heycen-9a9d8",
            storageBucket: "heycen-9a9d8.firebasestorage.app",
            messagingSenderId: "442359961958",
            appId: "1:442359961958:web:815606d4836a66003d50a7",
            measurementId: "G-XNQSP1R3JR"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let tg = window.Telegram.WebApp;
        tg.expand();

        let user = tg.initDataUnsafe.user;
        let userId = user ? user.id.toString() : "7757851056"; 
        let userRef = db.ref('users/' + userId);

        let userData = { points: 0, gp: 0, tasksDone: 0 };

        userRef.on('value', (snapshot) => {
            let data = snapshot.val();
            if (data) {
                userData = data;
                let currentPoints = data.points !== undefined ? data.points : (data.gp || 0);
                userData.points = currentPoints;
                userData.gp = currentPoints;
            } else {
                userRef.set({ points: 0, gp: 0, tasksDone: 0 });
            }
        });

        // --- Adsgram Controller Setup (Unit ID: 45025) ---
        let adController = null;
        if (window.Adsgram) {
            adController = window.Adsgram.init({ blockId: "45025" });
        }

        // Render 6 Video Ads
        const videoContainer = document.getElementById('video-ads-container');
        for (let i = 1; i <= 6; i++) {
            videoContainer.innerHTML += `
                <div class="video-card" id="vid-card-${i}">
                    <div class="video-top">
                        <div class="video-icon"><i class="fa-solid fa-video"></i></div>
                        <div class="video-info">
                            <h4>Video Ad #${i}</h4>
                            <p>Watch full ad</p>
                        </div>
                    </div>
                    <div class="video-bottom">
                        <div class="video-reward"><i class="fa-solid fa-coins"></i> +50 GP</div>
                        <button class="watch-btn" id="vid-btn-${i}" onclick="watchVideoAd(${i}, 50)">Watch</button>
                    </div>
                </div>
            `;
        }

        function watchVideoAd(id, points) {
            let btn = document.getElementById(`vid-btn-${id}`);
            if (btn.classList.contains('done')) return;

            btn.innerText = "Loading...";

            if (adController) {
                adController.show()
                    .then((result) => {
                        let currentPoints = userData.points !== undefined ? userData.points : (userData.gp || 0);
                        let newPoints = currentPoints + points;
                        let newTasksDone = (userData.tasksDone || 0) + 1;

                        userData.points = newPoints;
                        userData.gp = newPoints;
                        userData.tasksDone = newTasksDone;

                        userRef.set(userData).then(() => {
                            btn.innerText = "Done ✓";
                            btn.classList.add('done');
                            tg.showAlert(`Video Ad #${id} completed! +${points} GP added.`);
                        });
                    })
                    .catch((result) => {
                        btn.innerText = "Watch";
                        tg.showAlert("Ad was skipped or not available. Please try again!");
                    });
            } else {
                btn.innerText = "Watch";
                tg.showAlert("Adsgram SDK not loaded properly!");
            }
        }

        // Swipe & Navigation Logic
        let touchStartX = 0;
        window.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; });
        window.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].screenX;
            let diff = touchEndX - touchStartX;
            const container = document.getElementById('mainContainer');
            const bottomNav = document.getElementById('bottomNav');

            if (Math.abs(diff) > 50) {
                if (diff > 0) {
                    container.classList.add('page-slide-right');
                    bottomNav.style.background = '#064e3b';
                    setTimeout(() => { window.location.href = "task.html"; }, 250);
                } else {
                    container.classList.add('page-slide-left');
                    bottomNav.style.background = '#1e1b4b';
                    setTimeout(() => { window.location.href = "hotcake.html"; }, 250);
                }
            }
        });
    </script>
</body>
</html>
