<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeyCen - Shipping Address</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #070913; 
            --card-bg: #0e1628;
            --card-border: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 480px;
            box-sizing: border-box;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        .back-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            width: 38px; height: 38px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            text-decoration: none;
            font-size: 16px;
        }
        .form-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 600;
        }
        .form-input {
            width: 100%;
            background: #070913;
            border: 1px solid var(--card-border);
            padding: 12px;
            border-radius: 10px;
            color: #fff;
            font-size: 13px;
            box-sizing: border-box;
            outline: none;
        }
        .form-input:focus {
            border-color: #38bdf8;
        }
        .save-btn {
            background: #38bdf8;
            color: #070913;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
        }
        .save-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <a href="profile.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
            <h2 style="margin:0; font-size: 18px; color: #fff;">Shipping Address</h2>
        </div>

        <div class="form-card">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="shipName" class="form-input" placeholder="Enter your full name">
            </div>
            <div class="form-group">
                <label>Telegram ID</label>
                <input type="text" id="shipId" class="form-input" readonly style="opacity: 0.7;">
            </div>
            <div class="form-group">
                <label>Location / Address</label>
                <input type="text" id="shipLocation" class="form-input" placeholder="Street, City, Area">
            </div>
            <div class="form-group">
                <label>Zip Code</label>
                <input type="text" id="shipZip" class="form-input" placeholder="Postal / Zip code">
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="text" id="shipPhone" class="form-input" placeholder="Enter phone number">
            </div>
            <button class="save-btn" onclick="saveAddressData()">Save Address</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBeekTPKMLpOhBH_fMB3eIqWgGy8APQFa8",
            authDomain: "heycen-9a9d8.firebaseapp.com",
            databaseURL: "https://heycen-9a9d8-default-rtdb.firebaseio.com",
            projectId: "heycen-9a9d8",
            storageBucket: "heycen-9a9d8.firebasestorage.app",
            messagingSenderId: "442359961958",
            appId: "1:442359961958:web:815606d4836a66003d50a7",
            measurementId: "G-XNQSP1R3JR"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let tg = window.Telegram.WebApp;
        tg.expand();

        let user = tg.initDataUnsafe.user;
        let userId = user ? user.id.toString() : "7757851056";
        let defaultName = user ? (user.first_name || "") : "";

        document.getElementById('shipId').value = userId;

        // পেজ লোড হওয়ার সময় ফায়ারবেস থেকে আগের সেভ করা ডেটা ফর্ম ইনপুটে নিয়ে আসা
        db.ref('users/' + userId + '/address').once('value', snap => {
            let data = snap.val();
            if (data) {
                document.getElementById('shipName').value = data.fullName || defaultName;
                document.getElementById('shipLocation').value = data.address || '';
                document.getElementById('shipZip').value = data.zip || '';
                document.getElementById('shipPhone').value = data.phone || '';
            } else {
                document.getElementById('shipName').value = defaultName;
            }
        });

        function saveAddressData() {
            let fullName = document.getElementById('shipName').value.trim();
            let address = document.getElementById('shipLocation').value.trim();
            let zip = document.getElementById('shipZip').value.trim();
            let phone = document.getElementById('shipPhone').value.trim();

            if(!fullName || !address || !zip || !phone) {
                tg.showAlert("⚠️ Please fill in all the required fields!");
                return;
            }

            let addressData = {
                fullName: fullName,
                address: address,
                zip: zip,
                phone: phone,
                updatedAt: Date.now()
            };

            // সরাসরি ফায়ারবেসের ডাটাবেজে সেভ করা হচ্ছে যাতে Shopadmin.html থেকে দেখতে পাওয়া যায়
            db.ref('users/' + userId + '/address').set(addressData).then(() => {
                tg.showAlert("✅ Shipping Address saved successfully!");
                setTimeout(() => {
                    window.location.href = "profile.html";
                }, 1200);
            }).catch(error => {
                tg.showAlert("❌ Error saving address: " + error.message);
            });
        }
    </script>
</body>
</html>
