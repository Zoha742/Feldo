<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeyCen - Profile</title>
    <!-- Telegram Web App Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131c2e;
            --card-border: #2a1b4e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary-gradient: linear-gradient(135deg, #7c3aed 0%, #4c1d95 100%);
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0 0 90px 0;
            display: flex;
            justify-content: center;
            overflow-x: hidden;
        }
        .container {
            width: 100%;
            max-width: 480px;
            padding: 16px;
            box-sizing: border-box;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        /* সোয়াইপ অ্যানিমেশন ক্লাস */
        .page-slide-left { transform: translateX(-100px); opacity: 0; }
        .page-slide-right { transform: translateX(100px); opacity: 0; }

        .profile-header {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            margin-bottom: 20px;
        }
        .profile-avatar { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 3px solid #7c3aed; margin-bottom: 12px; }
        .profile-name { font-size: 18px; font-weight: 700; margin: 0 0 4px 0; }
        .profile-id { font-size: 12px; color: var(--text-muted); margin: 0; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 16px;
            border-radius: 16px;
            text-align: center;
        }
        .stat-card h4 { margin: 0 0 6px 0; font-size: 12px; color: var(--text-muted); }
        .stat-card p { margin: 0; font-size: 18px; font-weight: 700; color: #fbbf24; }

        .menu-list {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .menu-item-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            color: var(--text-main);
            text-decoration: none;
            border-bottom: 1px solid var(--card-border);
            font-size: 14px;
            font-weight: 600;
        }
        .menu-item-link:last-child { border-bottom: none; }
        .menu-item-left { display: flex; align-items: center; gap: 12px; }
        .menu-item-left i { font-size: 18px; color: #c084fc; width: 24px; text-align: center; }

        /* ৫টি অপশনসহ নেভিগেশন বার এবং ডাইনামিক কালার ইফেক্ট */
        .bottom-nav { 
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); 
            width: 100%; max-width: 480px; background: var(--card-bg); 
            border-top: 1px solid var(--card-border); display: flex; justify-content: space-around; 
            padding: 10px 0; box-sizing: border-box; z-index: 100; 
            transition: background 0.3s ease;
        }
        .nav-item { text-align: center; color: var(--text-muted); text-decoration: none; font-size: 10px; font-weight: 600; cursor: pointer; flex: 1; }
        .nav-item.active { color: #c084fc; }
        .nav-item i { font-size: 16px; display: block; margin-bottom: 3px; }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <div class="profile-header">
            <img id="user-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" class="profile-avatar" alt="Avatar">
            <h3 class="profile-name" id="profile-name">User Name</h3>
            <p class="profile-id">ID: <span id="profile-id">7757851056</span></p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h4>Total Balance</h4>
                <p id="profile-balance">0 GP</p>
            </div>
            <div class="stat-card">
                <h4>Tasks Done</h4>
                <p id="profile-tasks">0</p>
            </div>
        </div>

        <div class="menu-list">
            <a href="wallet.html" class="menu-item-link">
                <div class="menu-item-left"><i class="fa-solid fa-wallet"></i> Wallet & Payments</div>
                <i class="fa-solid fa-chevron-right" style="color: var(--text-muted); font-size: 12px;"></i>
            </a>
            <a href="agent.html" class="menu-item-link">
                <div class="menu-item-left"><i class="fa-solid fa-handshake"></i> Agent & Qualification</div>
                <i class="fa-solid fa-chevron-right" style="color: var(--text-muted); font-size: 12px;"></i>
            </a>
            <a href="admin.html" class="menu-item-link" id="admin-menu-link" style="display:none;">
                <div class="menu-item-left"><i class="fa-solid fa-crown" style="color: gold;"></i> Master Admin Center</div>
                <i class="fa-solid fa-chevron-right" style="color: var(--text-muted); font-size: 12px;"></i>
            </a>
        </div>
    </div>

    <!-- ৫টি অপশনসহ নেভিগেশন বার (hotcake.html সহ) -->
    <div class="bottom-nav" id="bottomNav">
        <a class="nav-item" href="index.html"><i class="fa-solid fa-house"></i>Home</a>
        <a class="nav-item" href="task.html"><i class="fa-solid fa-list-check"></i>Task</a>
        <a class="nav-item" href="ads.html"><i class="fa-solid fa-play"></i>Ads</a>
        <a class="nav-item" href="hotcake.html"><i class="fa-solid fa-hammer"></i>Mining</a>
        <a class="nav-item active" href="profile.html"><i class="fa-solid fa-user"></i>Profile</a>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBeekTPKMLpOhBH_fMB3eIqWgGy8APQFa8",
            authDomain: "heycen-9a9d8.firebaseapp.com",
            databaseURL: "https://heycen-9a9d8-default-rtdb.firebaseio.com",
            projectId: "heycen-9a9d8",
            storageBucket: "heycen-9a9d8.firebasestorage.app",
            messagingSenderId: "442359961958",
            appId: "1:442359961958:web:815606d4836a66003d50a7",
            measurementId: "G-XNQSP1R3JR"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let tg = window.Telegram.WebApp;
        tg.expand();

        let user = tg.initDataUnsafe.user;
        let userId = user ? user.id.toString() : "7757851056";
        let username = user ? (user.first_name || "User") : "User";

        document.getElementById('profile-name').innerText = username;
        document.getElementById('profile-id').innerText = userId;
        if (user && user.photo_url) {
            document.getElementById('user-avatar').src = user.photo_url;
        }

        // Master Admin ID Check
        const ADMIN_ID = "7757851056";
        if (userId === ADMIN_ID) {
            document.getElementById('admin-menu-link').style.display = 'flex';
        }

        let userRef = db.ref('users/' + userId);
        userRef.on('value', (snapshot) => {
            let data = snapshot.val();
            if (data) {
                let currentPoints = data.points !== undefined ? data.points : (data.gp || 0);
                document.getElementById('profile-balance').innerText = currentPoints.toLocaleString() + " GP";
                document.getElementById('profile-tasks').innerText = data.tasksDone || 0;
            } else {
                document.getElementById('profile-balance').innerText = "0 GP";
                document.getElementById('profile-tasks').innerText = "0";
            }
        });

        // সোয়াইপ অ্যানিমেশন এবং ডাইনামিক কালার পরিবর্তনের লজিক
        let touchStartX = 0;
        window.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; });
        window.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].screenX;
            let diff = touchEndX - touchStartX;
            const container = document.getElementById('mainContainer');
            const bottomNav = document.getElementById('bottomNav');

            if (Math.abs(diff) > 50) {
                if (diff > 0) {
                    // ডান দিকে টানলে Hotcake (hotcake.html) পেজে যাবে
                    container.classList.add('page-slide-right');
                    bottomNav.style.background = '#1e1b4b';
                    setTimeout(() => { window.location.href = "hotcake.html"; }, 250);
                }
            }
        });
    </script>
</body>
</html>
