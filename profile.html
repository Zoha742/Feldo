<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f8fafc; color: #0f172a; margin: 0; padding: 16px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 480px; text-align: center; }
        .profile-card { background: #fff; border: 1px solid #e2e8f0; padding: 24px; border-radius: 16px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile-card">
            <h3 id="profName" style="margin: 0 0 5px 0;">User Profile</h3>
            <p style="color: #64748b; font-size: 13px; margin: 0;">Status: Verified Hub Member</p>
        </div>
        <br>
        <button style="background: #e2e8f0; border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 600;" onclick="location.href='index.html'"><i class="fa-solid fa-arrow-left"></i> Home</button>
    </div>
    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        let user = tg.initDataUnsafe.user;
        if(user && user.first_name) {
            document.getElementById('profName').innerText = user.first_name + "'s Profile";
        }
    </script>
</body>
</html>
