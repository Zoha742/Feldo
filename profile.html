<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeyCen - Profile</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #070913;
            --card-bg: #0e1628;
            --card-border: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0 0 100px 0;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 480px;
            padding: 16px;
            box-sizing: border-box;
        }
        .profile-card {
            background: linear-gradient(135deg, #0e1628 0%, #171c3a 100%);
            border: 1px solid #2d2456;
            border-radius: 20px;
            padding: 16px;
            display: flex; align-items: center; gap: 14px;
            margin-bottom: 16px;
        }
        .profile-card.verified {
            border: 1px solid #a855f7;
            box-shadow: 0 8px 30px rgba(168, 85, 247, 0.25);
        }
        .avatar-container { width: 65px; height: 65px; border-radius: 50%; padding: 2px; background: linear-gradient(135deg, #a855f7, #6366f1); flex-shrink: 0; }
        .avatar-container img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        .profile-info h3 { margin: 0 0 2px 0; font-size: 16px; color: #fff; display: flex; align-items: center; gap: 6px; }
        .verified-badge { display: none; color: #38bdf8; font-size: 13px; }
        .profile-card.verified .verified-badge { display: inline-block; }
        .username-text { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
        .user-id-badge { font-size: 11px; color: #c084fc; font-weight: 650; background: rgba(139, 92, 246, 0.15); padding: 1px 6px; border-radius: 6px; cursor: pointer; }

        .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
        
        .bottom-nav {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 480px; background: var(--card-bg);
            border-top: 1px solid var(--card-border); display: flex; justify-content: space-around;
            padding: 14px 0 16px 0; box-sizing: border-box; z-index: 100;
        }
        .nav-item { text-align: center; color: var(--text-muted); text-decoration: none; font-size: 12px; font-weight: 600; cursor: pointer; flex: 1; }
        .nav-item.active { color: #c084fc; }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 5px; }
    </style>
</head>
<body>

    <div class="container">
        <h2 style="margin-top:0;">My Profile</h2>

        <!-- প্রফাইল কার্ড -->
        <div class="profile-card" id="profileCardElement">
            <div class="avatar-container">
                <img id="user-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" alt="Avatar">
            </div>
            <div class="profile-info" style="width:100%;">
                <h3 id="profile-name">
                    <span id="name-text">User</span> 
                    <i class="fa-solid fa-circle-check verified-badge" title="Verified"></i>
                </h3>
                <div class="username-text" id="profile-username">@user</div>
                <div><span class="user-id-badge" id="profile-id">ID: Loading...</span></div>
            </div>
        </div>

        <!-- অর্ডার হিস্টরি সেকশন -->
        <div class="card">
            <h4 style="margin-top:0;"><i class="fa-solid fa-bag-shopping" style="color:#ec4899;"></i> My Shop Orders</h4>
            <div id="my-orders-container" style="max-height: 200px; overflow-y: auto;">
                <small style="color: var(--text-muted);">Loading your orders...</small>
            </div>
        </div>

        <!-- অ্যাডমিন প্যানেল বাটন (শুধু অ্যাডমিনের জন্য শো করবে) -->
        <a class="card" id="admin-panel-btn" href="admin.html" style="display:none; text-decoration:none; align-items:center; justify-content:space-between; border-color:#ef4444; background:linear-gradient(135deg, rgba(127,29,29,0.2), rgba(69,10,10,0.3));">
            <div>
                <h5 style="margin:0; color:#f87171; font-size:14px;"><i class="fa-solid fa-user-shield"></i> Admin Panel</h5>
                <p style="margin:2px 0 0 0; font-size:11px; color:#fca5a5;">Master control center</p>
            </div>
            <i class="fa-solid fa-chevron-right" style="color:#f87171;"></i>
        </a>
    </div>

    <!-- নেভিগেশন বার -->
    <div class="bottom-nav">
        <a class="nav-item" href="index.html"><i class="fa-solid fa-house"></i>Home</a>
        <a class="nav-item" href="task.html"><i class="fa-solid fa-list-check"></i>Task</a>
        <a class="nav-item" href="shop.html"><i class="fa-solid fa-store"></i>Shop</a>
        <a class="nav-item" href="hotcake.html"><i class="fa-solid fa-hammer"></i>Hotcake</a> 
        <a class="nav-item active" href="profile.html"><i class="fa-solid fa-user"></i>Profile</a>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBeekTPKMLpOhBH_fMB3eIqWgGy8APQFa8",
            authDomain: "heycen-9a9d8.firebaseapp.com",
            databaseURL: "https://heycen-9a9d8-default-rtdb.firebaseio.com",
            projectId: "heycen-9a9d8",
            storageBucket: "heycen-9a9d8.firebasestorage.app",
            messagingSenderId: "442359961958",
            appId: "1:442359961958:web:815606d4836a66003d50a7",
            measurementId: "G-XNQSP1R3JR"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let tg = window.Telegram.WebApp;
        tg.expand();

        let user = tg.initDataUnsafe.user;
        let userId = user ? user.id.toString() : "7757851056"; 
        let firstName = user ? (user.first_name || "User") : "User";
        let username = (user && user.username) ? `@${user.username}` : `@user`;
        const ADMIN_USER_ID = "7757851056";

        document.getElementById('name-text').innerText = firstName;
        document.getElementById('profile-username').innerText = username;
        document.getElementById('profile-id').innerText = `ID: ${userId}`;

        if (userId === ADMIN_USER_ID) {
            document.getElementById('admin-panel-btn').style.display = "flex";
        }
        if (user && user.photo_url) {
            document.getElementById('user-avatar').src = user.photo_url;
        }

        // ইউজারের ভেরিফিকেশন স্ট্যাটাস ও অর্ডার হিস্টরি লোড করা
        db.ref('users/' + userId).on('value', snap => {
            let data = snap.val();
            let isVerified = data && data.isVerified === true;
            let card = document.getElementById('profileCardElement');
            if (isVerified) card.classList.add('verified');
            else card.classList.remove('verified');
        });

        // ইউজারের শপ অর্ডার লিস্ট লোড
        db.ref('shop_orders').orderByChild('userId').equalTo(userId).on('value', snap => {
            let container = document.getElementById('my-orders-container');
            let html = "";
            if (snap.exists()) {
                snap.forEach(child => {
                    let order = child.val();
                    let statusColor = order.status === 'Approved' ? '#22c55e' : '#f59e0b';
                    let statusText = order.status === 'Approved' ? 'Order Accepted ✅' : 'Pending ⏳';

                    html += `
                        <div style="background: #070913; border: 1px solid #1e293b; padding: 10px; border-radius: 10px; margin-bottom: 8px;">
                            <b style="color: #fff; font-size: 13px;">${order.itemName}</b><br>
                            <small style="color: #fbbf24;">Cost: ${order.price.toLocaleString()} GP</small><br>
                            <small style="color: ${statusColor}; font-weight: bold;">Status: ${statusText}</small>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } else {
                container.innerHTML = `<small style="color: var(--text-muted);">You haven't ordered anything yet.</small>`;
            }
        });
    </script>
</body>
</html>
