<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feldo - Drop Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131c2e;
            --card-border: #2a1b4e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary-gradient: linear-gradient(135deg, #7c3aed 0%, #4c1d95 100%);
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0 0 100px 0;
            display: flex;
            justify-content: center;
            overflow-x: hidden;
            user-select: none;
        }
        .container {
            width: 100%;
            max-width: 480px;
            padding: 16px;
            box-sizing: border-box;
            text-align: center;
        }
        .game-header {
            background: var(--primary-gradient);
            border-radius: 16px;
            padding: 16px;
            color: #fff;
            margin-bottom: 16px;
            box-shadow: 0 10px 25px -5px rgba(124, 58, 237, 0.4);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .game-header h2 { margin: 0; font-size: 18px; }
        .score-box { font-size: 14px; font-weight: 700; background: rgba(255,255,255,0.15); padding: 6px 12px; border-radius: 10px; color: #fbbf24; }

        /* গেম ক্যানভাস এরিয়া */
        .game-canvas-wrapper {
            position: relative;
            width: 100%;
            height: 380px;
            background: #070913;
            border: 2px solid var(--card-border);
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 16px;
            touch-action: none;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .game-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .action-btn {
            background: #7c3aed;
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.4);
        }
        .action-btn:hover { background: #6d28d9; }
        .action-btn:disabled { background: #334155; color: #94a3b8; cursor: not-allowed; box-shadow: none; }

        .rules-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 14px;
            text-align: left;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 16px;
        }
        .rules-card h4 { margin: 0 0 6px 0; color: #fff; font-size: 13px; }
        .rules-card ul { margin: 0; padding-left: 16px; }

        /* বটম নেভিগেশন বার */
        .bottom-nav { 
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); 
            width: 100%; max-width: 480px; background: var(--card-bg); 
            border-top: 1px solid var(--card-border); display: flex; justify-content: space-around; 
            padding: 12px 0 14px 0; box-sizing: border-box; z-index: 100; 
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.3);
        }
        .nav-item { text-align: center; color: var(--text-muted); text-decoration: none; font-size: 11px; font-weight: 600; cursor: pointer; flex: 1; transition: color 0.2s, transform 0.2s; }
        .nav-item.active { color: #c084fc; transform: translateY(-2px); }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="game-header">
            <h2>⚡ Feldo Drop Game</h2>
            <div class="score-box">Gold: <span id="currentScore">0</span></div>
        </div>

        <div class="game-canvas-wrapper">
            <canvas id="gameCanvas"></canvas>
        </div>

        <div class="game-controls">
            <button id="startBtn" class="action-btn" onclick="startGame()">Play Game (-20 GP)</button>
        </div>

        <div class="rules-card">
            <h4>🎮 How to Play:</h4>
            <ul>
                <li>Playing costs <strong>20 GP (Fuel)</strong> from your balance.</li>
                <li>Tap falling Gold Coins to catch and earn points!</li>
                <li>Avoid red bomb items, or you will lose points.</li>
                <li>Earned Gold Points can be used in the <strong>Shop</strong>!</li>
            </ul>
        </div>
    </div>

    <!-- সুসজ্জিত ৫টি অপশনসহ নেভিগেশন বার -->
    <div class="bottom-nav">
        <a class="nav-item" href="index.html"><i class="fa-solid fa-house"></i>Home</a>
        <a class="nav-item active" href="game.html"><i class="fa-solid fa-gamepad"></i>Game</a>
        <a class="nav-item" href="task.html"><i class="fa-solid fa-list-check"></i>Task</a>
        <a class="nav-item" href="hotcake.html"><i class="fa-solid fa-hammer"></i>Hotcake</a>
        <a class="nav-item" href="profile.html"><i class="fa-solid fa-user"></i>Profile</a>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBeekTPKMLpOhBH_fMB3eIqWgGy8APQFa8",
            authDomain: "heycen-9a9d8.firebaseapp.com",
            databaseURL: "https://heycen-9a9d8-default-rtdb.firebaseio.com",
            projectId: "heycen-9a9d8",
            storageBucket: "heycen-9a9d8.firebasestorage.app",
            messagingSenderId: "442359961958",
            appId: "1:442359961958:web:815606d4836a66003d50a7",
            measurementId: "G-XNQSP1R3JR"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let tg = window.Telegram.WebApp;
        tg.expand();

        let user = tg.initDataUnsafe.user;
        let userId = user ? user.id.toString() : "7757851056";
        let userRef = db.ref('users/' + userId);

        let userGp = 0;
        let userGold = 0;

        userRef.on('value', snap => {
            let data = snap.val() || {};
            userGp = data.gp !== undefined ? data.gp : (data.points || 0);
            userGold = data.gold !== undefined ? data.gold : 0;
        });

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = 360;
        canvas.height = 380;

        let gameRunning = false;
        let score = 0;
        let items = [];
        let gameInterval, itemSpawner;

        function startGame() {
            if (userGp < 20) {
                tg.showAlert("❌ Insufficient GP Fuel! Complete tasks or claim hotcake to get GP.");
                return;
            }

            // ২০ GP কেটে নেওয়া হলো
            userGp -= 20;
            userRef.update({ gp: userGp, points: userGp }).then(() => {
                gameRunning = true;
                score = 0;
                items = [];
                document.getElementById('currentScore').innerText = score;
                document.getElementById('startBtn').disabled = true;
                document.getElementById('startBtn').innerText = "Game Running...";

                // আইটেম স্পন করা (ওপর থেকে নিচে পড়া)
                itemSpawner = setInterval(spawnItem, 500);
                gameInterval = requestAnimationFrame(updateGame);

                // ৩০ সেকেন্ড পর গেম শেষ হবে
                setTimeout(() => {
                    endGame();
                }, 30000);
            });
        }

        function spawnItem() {
            if (!gameRunning) return;
            let isBomb = Math.random() < 0.2; // ২০% চান্স বোমা আসার
            items.push({
                x: Math.random() * (canvas.width - 30) + 15,
                y: -20,
                radius: 16,
                speed: Math.random() * 2 + 2,
                isBomb: isBomb,
                text: isBomb ? "💣" : "🪙"
            });
        }

        function updateGame() {
            if (!gameRunning) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // আইটেমগুলোর পজিশন আপডেট ও ড্র করা
            for (let i = items.length - 1; i >= 0; i--) {
                let item = items[i];
                item.y += item.speed;

                ctx.font = "24px Arial";
                ctx.fillText(item.text, item.x - 12, item.y + 8);

                // ক্যানভাস থেকে বাইরে চলে গেলে রিমুভ করা
                if (item.y > canvas.height + 20) {
                    items.splice(i, 1);
                }
            }

            gameInterval = requestAnimationFrame(updateGame);
        }

        // টাচ বা ক্লিক করে কয়েন ধরা (Catching items)
        canvas.addEventListener('pointerdown', (e) => {
            if (!gameRunning) return;
            const rect = canvas.getBoundingClientRect();
            const clickX = (e.clientX - rect.left) * (canvas.width / rect.width);
            const clickY = (e.clientY - rect.top) * (canvas.height / rect.height);

            for (let i = items.length - 1; i >= 0; i--) {
                let item = items[i];
                let dist = Math.hypot(clickX - item.x, clickY - item.y);
                if (dist < 30) {
                    if (item.isBomb) {
                        score = Math.max(0, score - 5); // বোমা ধরলে ৫ পয়েন্ট কাটবে
                    } else {
                        score += 10; // কয়েন ধরলে ১০ পয়েন্ট যোগ হবে
                    }
                    document.getElementById('currentScore').innerText = score;
                    items.splice(i, 1);
                    break;
                }
            }
        });

        function endGame() {
            gameRunning = false;
            clearInterval(itemSpawner);
            cancelAnimationFrame(gameInterval);

            // গেম শেষে অর্জিত পয়েন্ট Gold Points হিসেবে সেভ করা
            userRef.once('value').then(snap => {
                let data = snap.val() || {};
                let currentGold = data.gold !== undefined ? data.gold : 0;
                let newGold = currentGold + score;

                userRef.update({ gold: newGold }).then(() => {
                    tg.showAlert(`🎉 Game Over! You earned 🪙 ${score} Gold Points.`);
                    document.getElementById('startBtn').disabled = false;
                    document.getElementById('startBtn').innerText = "Play Game (-20 GP)";
                });
            });
        }
    </script>
</body>
</html>
