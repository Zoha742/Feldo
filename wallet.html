<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeyCen - My Crypto UIDs</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131c2e;
            --card-border: #2a1b4e; 
            --text-main: #f8fafc;
            --text-muted: #94a3b8; 
            --primary-gradient: linear-gradient(135deg, #7c3aed 0%, #4c1d95 100%);
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0 0 90px 0;
            display: flex;
            justify-content: center;
            overflow-x: hidden;
        }
        .container {
            width: 100%;
            max-width: 480px;
            padding: 16px;
            box-sizing: border-box;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        /* সোয়াইপ অ্যানিমেশন ক্লাস */
        .page-slide-left { transform: translateX(-100px); opacity: 0; }
        .page-slide-right { transform: translateX(100px); opacity: 0; }

        .top-title {
            text-align: center;
            color: #fbbf24;
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }

        .wallet-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            transition: 0.3s ease;
        }
        .wallet-card:hover { border-color: rgba(192, 132, 252, 0.5); }

        .wallet-title {
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .wallet-title .icon-box {
            width: 32px; height: 32px;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            color: #fff;
            font-size: 14px;
        }

        .wallet-input {
            width: 100%;
            background: #050a14;
            border: 1px solid #2a3b68;
            padding: 12px;
            border-radius: 12px;
            color: #fff;
            font-size: 13px;
            box-sizing: border-box;
            margin-bottom: 14px;
            outline: none;
        }
        .wallet-input:focus { border-color: #7c3aed; }

        .save-btn {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: #fff;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
            transition: 0.2s;
        }
        .save-btn:hover { opacity: 0.9; }

        /* নিচে সেন্টারে ব্যাক অ্যারো বাটন স্টাইল */
        .center-back-container {
            text-align: center;
            margin-top: 25px;
            margin-bottom: 10px;
        }
        .center-back-icon-btn {
            background: linear-gradient(135deg, #7c3aed, #4c1d95);
            border: 1px solid #9333ea;
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.4);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .center-back-icon-btn:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }

        /* ৫টি অপশনসহ নেভিগেশন বার */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-top: 1px solid var(--card-border);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            box-sizing: border-box;
            z-index: 100;
            transition: background 0.3s ease;
        }
        .nav-item {
            text-align: center;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            flex: 1;
        }
        .nav-item.active { color: #c084fc; }
        .nav-item i { font-size: 16px; display: block; margin-bottom: 3px; }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <div class="top-title">Wallet Setup</div>

        <!-- Bitget UID Card -->
        <div class="wallet-card">
            <div class="wallet-title">
                <div class="icon-box" style="background: linear-gradient(135deg, #38bdf8, #0284c7);"><i class="fa-solid fa-shield-halved"></i></div>
                Bitget UID
            </div>
            <input type="text" id="bitget-uid" class="wallet-input" placeholder="Enter Bitget UID">
            <button class="save-btn" onclick="saveUid('bitget')">Save Bitget UID</button>
        </div>

        <!-- Binance UID Card -->
        <div class="wallet-card">
            <div class="wallet-title">
                <div class="icon-box" style="background: linear-gradient(135deg, #f59e0b, #d97706);"><i class="fa-solid fa-wallet"></i></div>
                Binance UID
            </div>
            <input type="text" id="binance-uid" class="wallet-input" placeholder="Enter Binance UID">
            <button class="save-btn" onclick="saveUid('binance')">Save Binance UID</button>
        </div>

        <!-- নিচে সেন্টারে ব্যাক অ্যারো বাটন -->
        <div class="center-back-container">
            <button class="center-back-icon-btn" onclick="location.href='profile.html'" title="Back to Profile">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
        </div>
    </div>

    <!-- ৫টি অপশনসহ নেভিগেশন বার -->
    <div class="bottom-nav" id="bottomNav">
        <a class="nav-item" href="index.html"><i class="fa-solid fa-house"></i>Home</a>
        <a class="nav-item" href="task.html"><i class="fa-solid fa-list-check"></i>Task</a>
        <a class="nav-item" href="ads.html"><i class="fa-solid fa-play"></i>Ads</a>
        <a class="nav-item" href="hotcake.html"><i class="fa-solid fa-hammer"></i>Hotcake</a>
        <a class="nav-item" href="profile.html"><i class="fa-solid fa-user"></i>Profile</a>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBeekTPKMLpOhBH_fMB3eIqWgGy8APQFa8",
            authDomain: "heycen-9a9d8.firebaseapp.com",
            databaseURL: "https://heycen-9a9d8-default-rtdb.firebaseio.com",
            projectId: "heycen-9a9d8",
            storageBucket: "heycen-9a9d8.firebasestorage.app",
            messagingSenderId: "442359961958",
            appId: "1:442359961958:web:815606d4836a66003d50a7",
            measurementId: "G-XNQSP1R3JR"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let tg = window.Telegram.WebApp;
        tg.expand();

        let user = tg.initDataUnsafe.user;
        let userId = user ? user.id.toString() : "7757851056";
        let userRef = db.ref('users/' + userId);

        // Load existing UIDs if available
        userRef.on('value', (snapshot) => {
            let data = snapshot.val();
            if (data && data.uids) {
                if (data.uids.bitget) {
                    document.getElementById('bitget-uid').value = data.uids.bitget;
                }
                if (data.uids.binance) {
                    document.getElementById('binance-uid').value = data.uids.binance;
                }
            }
        });

        function saveUid(type) {
            let uidVal = "";
            let name = "";

            if (type === 'bitget') {
                uidVal = document.getElementById('bitget-uid').value.trim();
                name = "Bitget UID";
            } else if (type === 'binance') {
                uidVal = document.getElementById('binance-uid').value.trim();
                name = "Binance UID";
            }

            if (!uidVal) {
                tg.showAlert(`Please enter a valid ${name}!`);
                return;
            }

            userRef.child('uids/' + type).set(uidVal).then(() => {
                tg.showAlert(`${name} saved successfully!`);
            }).catch((error) => {
                tg.showAlert(`Failed to save: ${error.message}`);
            });
        }

        // সোয়াইপ অ্যানিমেশন লজিক
        let touchStartX = 0;
        window.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; });
        window.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].screenX;
            let diff = touchEndX - touchStartX;
            const container = document.getElementById('mainContainer');

            if (Math.abs(diff) > 50) {
                container.classList.add('page-slide-left');
                setTimeout(() => { window.location.href = "profile.html"; }, 250);
            }
        });
    </script>
</body>
</html>
