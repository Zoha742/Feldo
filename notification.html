<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeyCen - Notifications</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: rgba(28, 28, 30, 0.75);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f2f2f7;
            --text-muted: #8e8e93;
            --ios-blue: #0a84ff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0 0 110px 0;
            display: flex;
            justify-content: center;
            overflow-x: hidden;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        .container {
            width: 100%;
            max-width: 480px;
            padding: 16px;
            box-sizing: border-box;
        }

        /* আইফোন স্টাইল হেডার ব্যানার */
        .header-banner {
            background: linear-gradient(135deg, #1c1c1e 0%, #2c2c2e 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 22px;
            color: #fff;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .header-banner h2 { margin: 0 0 6px 0; font-size: 22px; font-weight: 700; letter-spacing: 0.3px; }
        .header-banner p { margin: 0; font-size: 13px; color: var(--text-muted); }

        /* আইফোন স্টাইল নোটিফিকেশন কার্ড (বড় ও ক্লিয়ার ডিসপ্লে) */
        .notif-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .notif-card {
            background: var(--card-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            gap: 14px;
            align-items: flex-start;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .notif-icon {
            width: 42px; height: 42px;
            background: rgba(10, 132, 255, 0.15);
            border: 1px solid rgba(10, 132, 255, 0.3);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            color: var(--ios-blue); font-size: 18px; flex-shrink: 0;
        }
        .notif-content h4 { margin: 0 0 6px 0; font-size: 16px; color: #fff; font-weight: 600; }
        .notif-content p { margin: 0 0 10px 0; font-size: 14px; color: #d1d1d6; line-height: 1.5; word-break: break-word; font-weight: 400; }
        
        .notif-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 8px;
            font-size: 11px;
            color: var(--text-muted);
        }
        .notif-time { color: #ffd60a; font-weight: 500; }

        .no-notif {
            text-align: center;
            color: var(--text-muted);
            margin-top: 60px;
            font-size: 14px;
        }

        /* ইমেজ ভিউয়ার মোডাল */
        .img-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 3000; align-items: center; justify-content: center; flex-direction: column; }
        .img-modal img { max-width: 92%; max-height: 80vh; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); }

        /* নিচের আইফোন স্টাইল নেভিগেশন বার ও ব্যাক অ্যারো */
        .bottom-nav {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); 
            width: 100%; max-width: 480px; background: rgba(28, 28, 30, 0.85); 
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border-top: 1px solid var(--card-border); display: flex; justify-content: space-around; 
            align-items: center; padding: 12px 0 16px 0; box-sizing: border-box; z-index: 100; 
        }
        .nav-item { text-align: center; color: var(--text-muted); text-decoration: none; font-size: 11px; font-weight: 500; cursor: pointer; flex: 1; }
        .nav-item.active { color: var(--ios-blue); }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 4px; }
        
        /* ব্যাক অ্যারো বাটন স্টাইল */
        .back-arrow-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none; color: #fff; width: 36px; height: 36px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 16px; transition: 0.2s;
        }
        .back-arrow-btn:active { transform: scale(0.9); }
    </style>
</head>
<body id="bodyContainer">

    <div class="container">
        <div class="header-banner">
            <h2>🔔 Inbox & Updates</h2>
            <p>Admin announcements & notices</p>
        </div>

        <div class="notif-list" id="notifications-container">
            <div class="no-notif">Loading messages...</div>
        </div>
    </div>

    <!-- Image Viewer Modal -->
    <div class="img-modal" id="imageModal" onclick="closeImageModal()">
        <span style="color:white; position:absolute; top:25px; right:30px; font-size:32px; cursor:pointer;">&times;</span>
        <img id="modalImage" src="" alt="Notification Media">
        <p style="color:var(--text-muted); font-size:12px; margin-top:15px;">Tap anywhere to close</p>
    </div>

    <!-- নেভিগেশন বার এবং ব্যাক অ্যারো -->
    <div class="bottom-nav">
        <button class="back-arrow-btn" onclick="location.href='profile.html'"><i class="fa-solid fa-arrow-left"></i></button>
        <a class="nav-item" href="index.html"><i class="fa-solid fa-house"></i>Home</a>
        <a class="nav-item" href="task.html"><i class="fa-solid fa-list-check"></i>Task</a>
        <a class="nav-item" href="ads.html"><i class="fa-solid fa-play"></i>Ads</a>
        <a class="nav-item" href="hotcake.html"><i class="fa-solid fa-hammer"></i>Hotcake</a>
        <a class="nav-item active" href="notification.html"><i class="fa-solid fa-bell"></i>Inbox</a>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBeekTPKMLpOhBH_fMB3eIqWgGy8APQFa8",
            authDomain: "heycen-9a9d8.firebaseapp.com",
            databaseURL: "https://heycen-9a9d8-default-rtdb.firebaseio.com",
            projectId: "heycen-9a9d8",
            storageBucket: "heycen-9a9d8.firebasestorage.app",
            messagingSenderId: "442359961958",
            appId: "1:442359961958:web:815606d4836a66003d50a7",
            measurementId: "G-XNQSP1R3JR"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let tg = window.Telegram.WebApp;
        tg.expand();

        let user = tg.initDataUnsafe.user;
        let userId = user ? user.id.toString() : "7757851056"; 

        let notifRef = db.ref('users/' + userId + '/notifications');
        notifRef.on('value', (snapshot) => {
            const container = document.getElementById('notifications-container');
            container.innerHTML = '';

            if (snapshot.exists()) {
                let notifs = snapshot.val();
                let keys = Object.keys(notifs).reverse();

                let updates = {};
                keys.forEach(key => {
                    updates[key + '/isRead'] = true;
                });
                notifRef.update(updates);

                keys.forEach(key => {
                    let item = notifs[key];
                    let title = item.title || "Admin Update";
                    let message = item.message || item.text || "";
                    
                    let dateObj = item.timestamp ? new Date(item.timestamp) : new Date();
                    let dateStr = dateObj.toLocaleDateString();
                    let timeStr = dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    
                    let mediaElement = "";
                    if (item.media) {
                        if (item.media.startsWith("data:video") || item.media.includes("video")) {
                            mediaElement = `<video src="${item.media}" controls style="width:100%; max-height:220px; border-radius:10px; margin-bottom:10px;"></video>`;
                        } else {
                            mediaElement = `<img src="${item.media}" style="width:100%; max-height:220px; object-fit:cover; border-radius:10px; margin-bottom:10px; cursor:pointer;" onclick="viewImage('${item.media}')">`;
                        }
                    }

                    container.innerHTML += `
                        <div class="notif-card">
                            <div class="notif-icon"><i class="fa-solid fa-bell"></i></div>
                            <div class="notif-content" style="width: 100%;">
                                <h4>${title}</h4>
                                ${mediaElement}
                                <p>${message}</p>
                                <div class="notif-footer">
                                    <span><i class="fa-regular fa-calendar"></i> ${dateStr}</span>
                                    <span class="notif-time"><i class="fa-regular fa-clock"></i> ${timeStr}</span>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } else {
                container.innerHTML = `<div class="no-notif">No messages or updates found!</div>`;
            }
        });

        // সোয়াইপ সিস্টেম (বাম দিকে সোয়াইপ করলে প্রোফাইলে চলে যাবে)
        let touchStartX = 0;
        window.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; });
        window.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].screenX;
            let diff = touchEndX - touchStartX;
            if (Math.abs(diff) > 70) {
                if (diff < 0) { // বাম দিকে সোয়াইপ
                    document.body.style.opacity = '0';
                    setTimeout(() => { window.location.href = "profile.html"; }, 250);
                }
            }
        });

        function viewImage(imgSrc) {
            document.getElementById('modalImage').src = imgSrc;
            document.getElementById('imageModal').style.display = 'flex';
        }
        function closeImageModal() {
            document.getElementById('imageModal').style.display = 'none';
        }
    </script>
</body>
</html>
